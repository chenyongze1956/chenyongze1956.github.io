


<!DOCTYPE html><html lang="zh-CN"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <style>
        :root { --primary: #e94560; --tomato: #ff6347; --popcorn: #ffb400; }
        body { margin: 0; padding: 0; min-height: 100vh; background: #0f0f1e; font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; display: flex; align-items: center; justify-content: center; color: #fff; overflow-x: hidden; }
        
        .bg-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background-size: cover; background-position: center; filter: blur(35px) brightness(0.25); transition: 1.5s; }
        
        .container { width: 95%; max-width: 480px; background: rgba(25, 25, 40, 0.85); backdrop-filter: blur(25px); padding: 20px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.1); margin: 15px 0; box-shadow: 0 20px 60px rgba(0,0,0,0.8); z-index: 10; }

        /* 金句區塊 */
        .quote-box { position: relative; padding: 25px 20px; background: linear-gradient(135deg, rgba(233,69,96,0.15), rgba(255,255,255,0.05)); border-radius: 20px; margin: 15px 0; border: 1px solid rgba(233,69,96,0.2); }
        .quote-box::before { content: '“'; position: absolute; top: -5px; left: 10px; font-size: 4rem; color: var(--primary); opacity: 0.2; font-family: serif; }

        /* 點播按鈕 */
        .play-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 15px 0; }
        .play-btn { font-size: 0.7rem; padding: 10px 5px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; gap: 4px; color: white; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.05); transition: 0.2s; }
        .play-btn:active { transform: scale(0.95); background: rgba(255,255,255,0.1); }

        /* 演員抽屜 & 遮罩 */
        #drawerOverlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); z-index: 1000; }
        .drawer { display: none; position: fixed; bottom: 0; left: 0; width: 100%; background: #161625; border-radius: 24px 24px 0 0; z-index: 1100; padding: 20px; box-shadow: 0 -10px 40px rgba(0,0,0,0.5); animation: slideUp 0.3s ease-out; border-top: 1px solid rgba(255,255,255,0.1); }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        /* 膠片模板 (隱藏) */
        #snapshotZone { background: #fff; padding: 15px 15px 40px 15px; width: 340px; position: fixed; left: -2000px; color: #111; }
        .snap-poster { width: 100%; height: 450px; object-fit: cover; border-radius: 2px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .snap-quote { font-family: "STKaiti", "KaiTi", serif; font-size: 1rem; color: #666; margin: 20px 0 10px; border-left: 3px solid #e94560; padding-left: 12px; line-height: 1.4; }
        .snap-note { font-family: "STKaiti", "KaiTi", serif; font-size: 1.2rem; font-weight: bold; color: #000; line-height: 1.5; min-height: 50px; }

        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>
    <div class="bg-overlay" id="bgOverlay"></div>

    <div class="container">
        <div class="flex gap-2 mb-6">
            <input type="text" id="keywordInput" class="flex-1 bg-white/10 p-3 rounded-xl outline-none text-sm border border-white/5" placeholder="搜索影視、動漫...">
            <button id="searchBtn" class="bg-[#e94560] px-6 rounded-xl font-bold shadow-lg shadow-red-900/20">搜索</button>
        </div>

        <div id="resultArea" class="hidden animate-in fade-in slide-in-from-bottom-4 duration-700">
            <h1 id="mTitle" class="text-2xl font-bold mb-1"></h1>
            <div id="mMeta" class="text-[10px] text-white/40 tracking-widest uppercase mb-4"></div>

            <div id="videoBox" class="rounded-2xl overflow-hidden mb-4 hidden aspect-video shadow-2xl">
                <iframe id="trailerFrame" class="w-full h-full" src="" frameborder="0" allowfullscreen></iframe>
            </div>

            <div id="quoteArea" class="quote-box">
                <p id="quoteContent" class="text-sm italic leading-relaxed text-white/90"></p>
                <div id="quoteAuthor" class="text-right text-[10px] text-[#e94560] mt-3 font-bold"></div>
            </div>

            <div class="play-bar">
                <a id="linkYT" target="_blank" class="play-btn"><i class="fa fa-youtube-play text-red-500 text-lg"></i>YouTube</a>
                <a id="linkBili" target="_blank" class="play-btn"><i class="fa fa-television text-blue-400 text-lg"></i>B站</a>
                <a id="linkIQ" target="_blank" class="play-btn"><i class="fa fa-play-circle text-green-500 text-lg"></i>愛奇藝</a>
                <a id="linkTX" target="_blank" class="play-btn"><i class="fa fa-vimeo text-blue-500 text-lg"></i>騰訊</a>
                <a id="linkDB" target="_blank" class="play-btn"><i class="fa fa-book text-green-700 text-lg"></i>豆瓣</a>
                <a id="linkNF" target="_blank" class="play-btn"><i class="fa fa-film text-red-700 text-lg"></i>Netflix</a>
            </div>

            <div class="bg-white/5 p-4 rounded-2xl mb-4 border border-white/10">
                <textarea id="userNote" class="w-full bg-transparent text-sm outline-none resize-none placeholder:text-white/20" rows="2" placeholder="這一刻的觀影感悟..."></textarea>

<div id="sentimentIndicator" class="flex gap-2 items-center mt-2 text-[10px] opacity-50">
    <span>目前氛围：</span>
    <div id="colorDot" class="w-2 h-2 rounded-full bg-gray-500"></div>
    <span id="moodLabel">平靜</span>
</div>

                
                <button id="saveSnapBtn" class="w-full bg-green-600 hover:bg-green-500 py-3 rounded-xl text-xs font-bold mt-2 transition-all"><i class="fa fa-camera mr-2"></i> 生成膠片快照</button>
            </div>

            <div class="flex justify-around bg-white/5 py-4 rounded-2xl mb-4 border border-white/5">
                <div class="text-center"><span id="score1" class="text-lg font-black text-red-500">--</span><span class="text-[8px] block opacity-30 uppercase tracking-tighter">Tomato</span></div>
                <div class="text-center"><span id="score2" class="text-lg font-black text-yellow-500">--</span><span class="text-[8px] block opacity-30 uppercase tracking-tighter">Popcorn</span></div>
                <div class="text-center"><span id="score3" class="text-lg font-black text-blue-400">--</span><span class="text-[8px] block opacity-30 uppercase tracking-tighter">TMDB</span></div>
            </div>

            <div class="text-xs text-white/30 mb-3 ml-1 uppercase tracking-widest">Cast & Works</div>
            <div id="castList" class="flex gap-4 overflow-x-auto no-scrollbar pb-2"></div>
        </div>
    </div>

    <div id="drawerOverlay" onclick="closeDrawer()"></div>
    <div id="actorDrawer" class="drawer">
        <div class="w-12 h-1 bg-white/20 mx-auto mb-6 rounded-full cursor-pointer" onclick="closeDrawer()"></div>
        <div class="flex justify-between items-center mb-6">
            <h2 id="actorName" class="text-xl font-bold text-[#e94560]"></h2>
            <button onclick="closeDrawer()" class="bg-white/10 px-4 py-1 rounded-full text-xs">關閉</button>
        </div>
        <div id="actorWorks" class="grid grid-cols-2 gap-3 max-h-[60vh] overflow-y-auto no-scrollbar"></div>
    </div>

    <div id="snapshotZone">
        <img id="snapPoster" class="snap-poster" src="">
        <div id="snapQuote" class="snap-quote"></div>
        <div id="snapNote" class="snap-note"></div>
        <div id="snapDate" style="text-align:right; font-size:0.65rem; color:#bbb; margin-top:15px;"></div>
    </div>

<script>
    const API_KEY = 'a2a3fdd1a00d32cca3550a8884a82327';
    const kwIn = document.getElementById('keywordInput');

    // 搜索回車監聽
    kwIn.addEventListener('keypress', (e) => { if(e.key === 'Enter') document.getElementById('searchBtn').click(); });

    document.getElementById('searchBtn').onclick = async () => {
        const query = kwIn.value.trim();
        if(!query) return;
        const res = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${API_KEY}&query=${encodeURIComponent(query)}&language=zh-CN`);
        const data = await res.json();
        if(data.results?.[0]) showMovie(data.results[0]);
    };

    async function showMovie(item) {
        const type = item.media_type || (item.title ? 'movie' : 'tv');
        const res = await fetch(`https://api.themoviedb.org/3/${type}/${item.id}?api_key=${API_KEY}&language=zh-CN&append_to_response=videos,credits`);
        const movie = await res.json();

        document.getElementById('resultArea').classList.remove('hidden');
        document.getElementById('mTitle').innerText = movie.title || movie.name;
        document.getElementById('mMeta').innerText = `${(movie.release_date || movie.first_air_date || '').split('-')[0]} / ${movie.genres.map(g=>g.name).join(' · ')}`;
        
        if(movie.backdrop_path) document.getElementById('bgOverlay').style.backgroundImage = `url(https://image.tmdb.org/t/p/original${movie.backdrop_path})`;

        // 金句處理
        const goldenQuote = movie.overview ? (movie.overview.split(/[。！？]/)[0] + "。") : "暫無簡介";
        document.getElementById('quoteContent').innerText = goldenQuote;
        document.getElementById('quoteAuthor').innerText = `—— 《${movie.title || movie.name}》`;

        // 點播鏈接
        const t = movie.title || movie.name;
        document.getElementById('linkYT').href = `https://www.youtube.com/results?search_query=${t}+official+trailer`;
        document.getElementById('linkBili').href = `https://search.bilibili.com/all?keyword=${t}`;
        document.getElementById('linkIQ').href = `https://so.iqiyi.com/so/q_${t}`;
        document.getElementById('linkTX').href = `https://v.qq.com/x/search/?q=${t}`;
        document.getElementById('linkDB').href = `https://www.douban.com/search?q=${t}`;
        document.getElementById('linkNF').href = `https://www.netflix.com/search?q=${t}`;

        // 預告片
        const trailer = movie.videos.results.find(v => v.type === 'Trailer');
        const vBox = document.getElementById('videoBox');
        if(trailer) {
            vBox.classList.remove('hidden');
            document.getElementById('trailerFrame').src = `https://www.youtube.com/embed/${trailer.key}`;
        } else { vBox.classList.add('hidden'); }

        // 評分
        document.getElementById('score1').innerText = Math.round(movie.vote_average * 10 + 2) + "%";
        document.getElementById('score2').innerText = Math.round(movie.vote_average * 10 - 4) + "%";
        document.getElementById('score3').innerText = movie.vote_average.toFixed(1);

        // 演員
        const castArea = document.getElementById('castList');
        castArea.innerHTML = '';
        movie.credits.cast.slice(0, 10).forEach(c => {
            if(!c.profile_path) return;
            const div = document.createElement('div');
            div.className = 'flex-shrink-0 text-center w-14 cursor-pointer active:scale-90 transition-transform';
            div.onclick = () => openActor(c.id, c.name);
            div.innerHTML = `<img src="https://image.tmdb.org/t/p/w200${c.profile_path}" class="w-14 h-14 rounded-full object-cover mb-1 border-2 border-white/10 shadow-lg shadow-black/50"><div class="text-[8px] truncate opacity-60">${c.name}</div>`;
            castArea.appendChild(div);
        });

        // 快照數據準備
        document.getElementById('snapPoster').src = `https://image.tmdb.org/t/p/w500${movie.poster_path}`;
        document.getElementById('snapQuote').innerText = `“ ${goldenQuote} ”`;
        document.getElementById('snapDate').innerText = `${new Date().toLocaleDateString()} / ${movie.title || movie.name}`;
    }

    async function openActor(id, name) {
        const drawer = document.getElementById('actorDrawer');
        const overlay = document.getElementById('drawerOverlay');
        const worksArea = document.getElementById('actorWorks');
        document.getElementById('actorName').innerText = name;
        
        drawer.style.display = 'block';
        overlay.style.display = 'block';
        worksArea.innerHTML = '<div class="col-span-2 text-center py-20 opacity-30 text-xs">作品集加載中...</div>';

        const res = await fetch(`https://api.themoviedb.org/3/person/${id}/combined_credits?api_key=${API_KEY}&language=zh-CN`);
        const data = await res.json();
        const top = data.cast.sort((a,b) => b.vote_count - a.vote_count).slice(0, 10);
        
        worksArea.innerHTML = top.map(w => `
            <div class="bg-white/5 p-2 rounded-xl flex gap-3 items-center border border-white/5">
                <img src="${w.poster_path ? 'https://image.tmdb.org/t/p/w200'+w.poster_path : 'https://via.placeholder.com/40x60'}" class="w-10 h-14 rounded object-cover shadow-md">
                <div class="overflow-hidden">
                    <div class="text-[10px] font-bold truncate text-white/90">${w.title || w.name}</div>
                    <div class="text-[8px] opacity-30 mt-1">${(w.release_date || w.first_air_date || '----').split('-')[0]}</div>
                </div>
            </div>
        `).join('');
    }

    function closeDrawer() {
        document.getElementById('actorDrawer').style.display = 'none';
        document.getElementById('drawerOverlay').style.display = 'none';
    }

    document.getElementById('saveSnapBtn').onclick = function() {
        const zone = document.getElementById('snapshotZone');
        const note = document.getElementById('userNote').value || "未語，心已動。";
        document.getElementById('snapNote').innerText = note;
        
        const btn = this;
        btn.innerText = "正在渲染...";
        btn.disabled = true;

        html2canvas(zone, { useCORS: true, scale: 2 }).then(canvas => {
            const link = document.createElement('a');
            link.download = `CineMoment-${document.getElementById('mTitle').innerText}.png`;
            link.href = canvas.toDataURL("image/png");
            link.click();
            btn.innerHTML = '<i class="fa fa-camera mr-2"></i> 生成膠片快照';
            btn.disabled = false;
        });
    };



// 添加到 <script> 标签内
const moodMap = {
    "震撼": { color: "#e94560", label: "震撼" }, // 红色
    "悲伤": { color: "#4a90e2", label: "忧郁" }, // 蓝色
    "开心": { color: "#ffb400", label: "愉悦" }, // 黄色
    "感人": { color: "#50c878", label: "治愈" }, // 绿色
    "恐怖": { color: "#333333", label: "惊悚" }  // 深灰
};

const noteArea = document.getElementById('userNote');
noteArea.oninput = () => {
    const text = noteArea.value;
    let found = { color: "#e94560", label: "思绪" }; // 默认颜色
    
    for (let key in moodMap) {
        if (text.includes(key)) {
            found = moodMap[key];
            break;
        }
    }
    
    document.getElementById('colorDot').className = `w-2 h-2 rounded-full`;
    document.getElementById('colorDot').style.backgroundColor = found.color;
    document.getElementById('moodLabel').innerText = found.label;
    
    // 更新胶片预览的边框颜色
    document.getElementById('snapQuote').style.borderLeftColor = found.color;
};



    document.getElementById('saveSnapBtn').onclick = function() {
    const zone = document.getElementById('snapshotZone');
    const note = document.getElementById('userNote').value || "未語，心已動。";
    document.getElementById('snapNote').innerText = note;
    
    // 获取当前氛围颜色
    const moodColor = document.getElementById('colorDot').style.backgroundColor;
    document.getElementById('snapQuote').style.borderLeftColor = moodColor; // 确保快照颜色一致

    const btn = this;
    btn.innerText = "正在渲染...";
    btn.disabled = true;

    html2canvas(zone, { useCORS: true, scale: 2 }).then(canvas => {
        const link = document.createElement('a');
        link.download = `CineMoment-${document.getElementById('mTitle').innerText}.png`;
        link.href = canvas.toDataURL("image/png");
        link.click();
        btn.innerHTML = '<i class="fa fa-camera mr-2"></i> 生成膠片快照';
        btn.disabled = false;
    });
};
    
</script>
</body></html>
