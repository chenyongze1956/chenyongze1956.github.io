

<!DOCTYPE html>
<html lang="en">

  <head>

      <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.9.6/lottie.min.js"></script>
    <meta charset="UTF-8">
    <title>Walk Loop (SVG Spritesheet)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="./style.css">

  </head>
    
  <body>
  <div id="lottie-container"></div>

    <div id="countdown-msg" style="text-align: center; margin: 20px; font-family: sans-serif;">
        <span id="seconds"></span> 
    </div>

    <script src='https://unpkg.com/gsap@3/dist/gsap.min.js'></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.9.6/lottie.min.js"></script>
    <script src="./script.js"></script>
    <script src='https://unpkg.com/gsap@3/dist/gsap.min.js'></script>
<script src='https://unpkg.com/gsap/dist/Observer.min.js'></script><script  src="./script.js"></script>

  </body>
  
</html>


<style>

#lottie-container {
    width: 30%;
    max-width: 300px;
    margin: 0 auto;
    display: block;
}

#seconds {
    opacity: 0.0;
}

body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column; /* 让内容垂直排列 */
    align-items: center; 
    justify-content: center; 
    background: linear-gradient(45deg, #ff7e5f, #feb47b, #ffed86, #9feb8f, #5fbfff, #9b8eff);
}
    </style>


    <script>
// 1. 初始化 Lottie 动画
const animation = lottie.loadAnimation({
    container: document.getElementById('lottie-container'),
    renderer: 'svg',
    loop: true,
    autoplay: true,
    path: 'https://od.lk/s/NDBfMTM5MjA1NDAwXw/jump-rope-fun-play-relax-svgrepo-com.json'
});

// 2. 状态控制
let isPlaying = true;

function toggleAnimation() {
    if (isPlaying) {
        animation.pause();
    } else {
        animation.play();
    }
    isPlaying = !isPlaying;
}

// 监听交互
window.addEventListener('mousedown', toggleAnimation);
window.addEventListener('touchstart', (e) => {
    e.preventDefault();
    toggleAnimation();
}, { passive: false });

// 3. 倒计时逻辑
let timeLeft = 20;
const secondsSpan = document.getElementById('seconds');
const timer = setInterval(() => {
    timeLeft--;
    secondsSpan.innerText = timeLeft;
    if (timeLeft <= 0) {
        clearInterval(timer);
        window.location.href = "https://chenyongze1956.github.io/login.html";
    }
}, 1000);
        
        </script>
