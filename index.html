<style>

#seconds{



  opacity:0.0;
    
}
    
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100vh;
    display: flex;
    /* 核心修改：改为垂直和水平居中 */
    align-items: center; 
    justify-content: center; 
    background: linear-gradient(45deg, #ff7e5f, #feb47b, #ffed86, #9feb8f, #5fbfff, #9b8eff);
}

svg {
    /* 适当调大尺寸以便看清，并确保其作为容器居中 */
    width: 30%; 
    max-width: 300px;
    overflow: hidden;
    /* 这一行保证行人在自身坐标系中也是居中的 */
    display: block;
}
    </style>


    <script>
const walkLoop = gsap.to("path", {
  x: -500,
  ease: "steps(5)",
  repeat: -1
});

const colorLoop = gsap.to("path", {
  duration: 12,
  fill: (i) => (i == 0 ? "hsl(720,100%,50%)" : "none"),
  stroke: (i) => (i == 0 ? "none" : "hsl(720,100%,50%)"),
  repeat: -1
});


        // 在原来的 script 中加入这几行，确保手机上点击也能跳跃
window.addEventListener('touchstart', (e) => {
    // 阻止默认点击行为（如页面滚动），让游戏体验更好
    e.preventDefault();
    jump();
}, { passive: false });



        // 定义一个全局变量控制状态
let isWalking = true;

function toggleWalk() {
    if (isWalking) {
        walkLoop.pause();
    } else {
        walkLoop.resume();
    }
    isWalking = !isWalking;
}

// 同时监听鼠标点击（桌面）和触摸（移动端）
window.addEventListener('mousedown', toggleWalk);
window.addEventListener('touchstart', (e) => {
    e.preventDefault(); // 防止双重触发
    toggleWalk();
}, { passive: false });




let timeLeft = 10;
    const secondsSpan = document.getElementById('seconds');
    
    const timer = setInterval(() => {
        timeLeft--;
        secondsSpan.innerText = timeLeft;
        
        if (timeLeft <= 0) {
            clearInterval(timer);
            window.location.href = "https://chenyongze1956.github.io/login.html";
        }
    }, 1000);


        
        </script>
