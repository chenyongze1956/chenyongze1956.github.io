<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>古巴比伦星空</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body {
      background: #080b24;
      color: #f7d98b;
    }
    canvas { display: block; width: 100%; height: 100%; }
    .info {
      position: fixed;
      top: 8vh;
      left: 8vw;
      pointer-events: none;
      text-shadow: 0 2px 18px rgba(245, 190, 76, .65);
      animation: appear 2s ease-out both;
    }
    h1 {
      margin: 0;
      font-size: clamp(2.2rem, 7vw, 5.5rem);
      font-weight: 300;
      letter-spacing: .25em;
    }
    p {
      margin: 1rem 0 0;
      color: #e8c77a;
      font-size: clamp(.9rem, 1.8vw, 1.2rem);
      letter-spacing: .35em;
    }
    .hint {
      position: fixed;
      right: 2rem;
      bottom: 1.5rem;
      color: rgba(232, 199, 122, .65);
      font-size: .85rem;
      letter-spacing: .12em;
    }
    @keyframes appear { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <canvas id="sky" aria-label="古巴比伦动态星空"></canvas>
  <div class="info">
  </div>
  <div class="hint"></div>
  <script>
    const canvas = document.getElementById('sky');
    const ctx = canvas.getContext('2d');
    let width, height, stars = [], shooting = [], pointer = { x: 0, y: 0 };
    const colors = ['#fff4c2', '#f7d98b', '#e8b94f', '#dca85c'];
    const constellations = [
      { points: [[.68,.18],[.73,.24],[.77,.19],[.81,.28],[.75,.34]], lines: [[0,1],[1,2],[1,3],[1,4],[2,3]] },
      { points: [[.42,.42],[.47,.36],[.52,.43],[.56,.35],[.61,.44]], lines: [[0,1],[1,2],[2,3],[3,4],[1,3]] },
      { points: [[.72,.56],[.77,.51],[.82,.57],[.86,.5],[.9,.59]], lines: [[0,1],[1,2],[2,3],[3,4]] }
    ];

    function resize() {
      const ratio = Math.min(window.devicePixelRatio || 1, 2);
      width = innerWidth; height = innerHeight;
      canvas.width = width * ratio; canvas.height = height * ratio;
      canvas.style.width = width + 'px'; canvas.style.height = height + 'px';
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      stars = Array.from({ length: Math.min(420, Math.floor(width * height / 4500)) }, () => ({
        x: Math.random() * width, y: Math.random() * height,
        r: Math.random() * 1.5 + .25, a: Math.random() * Math.PI * 2,
        speed: Math.random() * .018 + .004,
        twinkle: Math.random() * .7 + .3,
        color: colors[Math.floor(Math.random() * colors.length)]
      }));
    }
    function addShootingStar() {
      if (shooting.length < 2 && Math.random() < .012) shooting.push({
        x: Math.random() * width * .8 + width * .1, y: Math.random() * height * .35,
        vx: -(Math.random() * 7 + 8), vy: Math.random() * 4 + 4, life: 1
      });
    }
    function drawConstellations() {
      const offsetX = (pointer.x - width / 2) * .0015;
      const offsetY = (pointer.y - height / 2) * .0015;
      constellations.forEach(constellation => {
        const points = constellation.points.map(([x, y]) => ({ x: x * width + offsetX, y: y * height + offsetY }));
        ctx.strokeStyle = 'rgba(247, 217, 139, .28)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        constellation.lines.forEach(([a, b]) => {
          ctx.moveTo(points[a].x, points[a].y);
          ctx.lineTo(points[b].x, points[b].y);
        });
        ctx.stroke();
        points.forEach(point => {
          ctx.fillStyle = 'rgba(255, 244, 194, .9)';
          ctx.shadowColor = 'rgba(247, 217, 139, .8)';
          ctx.shadowBlur = 8;
          ctx.beginPath();
          ctx.arc(point.x, point.y, 2.2, 0, Math.PI * 2);
          ctx.fill();
        });
        ctx.shadowBlur = 0;
      });
    }
    function draw() {
      const gradient = ctx.createRadialGradient(width * .55, height * .35, 0, width * .5, height * .5, Math.max(width, height));
      gradient.addColorStop(0, '#293b78'); gradient.addColorStop(.45, '#111b4b'); gradient.addColorStop(1, '#080b24');
      ctx.fillStyle = gradient; ctx.fillRect(0, 0, width, height);
      drawConstellations();
      stars.forEach(s => {
        s.a += s.speed;
        const pulse = (Math.sin(s.a) + 1) / 2;
        const alpha = .24 + pulse * (.68 * s.twinkle);
        const radius = s.r * (.88 + pulse * .5);
        ctx.globalAlpha = alpha; ctx.fillStyle = s.color;
        if (pulse > .78 && s.r > 1) {
          ctx.shadowColor = s.color;
          ctx.shadowBlur = 8 + pulse * 12;
        }
        ctx.beginPath();
        ctx.arc(s.x + (pointer.x - width / 2) * .003, s.y + (pointer.y - height / 2) * .003, radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
      });
      shooting.forEach((s, i) => {
        const tail = 90;
        const grad = ctx.createLinearGradient(s.x, s.y, s.x - s.vx * tail / 10, s.y - s.vy * tail / 10);
        grad.addColorStop(0, 'rgba(255,244,194,' + s.life + ')'); grad.addColorStop(1, 'rgba(220,168,92,0)');
        ctx.strokeStyle = grad; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x - s.vx * tail / 10, s.y - s.vy * tail / 10); ctx.stroke();
        s.x += s.vx; s.y += s.vy; s.life -= .018; if (s.life <= 0) shooting.splice(i, 1);
      });
      ctx.globalAlpha = 1; addShootingStar(); requestAnimationFrame(draw);
    }
    addEventListener('resize', resize);
    addEventListener('mousemove', e => { pointer.x = e.clientX; pointer.y = e.clientY; });
    resize(); draw();
  </script>
</body>
</html>
