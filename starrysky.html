<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>✨ AI星空闪光宝可梦 ✨</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      touch-action: none;
      font-family: 'Comic Sans MS', 'Microsoft YaHei', cursive, sans-serif;
      background: #080b24;
    }

    #starfield {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      z-index: 0;
      display: block;
      touch-action: none;
    }

    #catch_screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      user-select: none;
      padding: 12px;
      background: radial-gradient(ellipse at center, rgba(8, 11, 36, 0.3) 0%, rgba(8, 11, 36, 0.6) 100%);
    }

    #encounter {
      position: relative;
      display: inline-block;
      width: min(200px, 50vw);
      height: min(200px, 50vw);
      margin: 0 auto;
      flex-shrink: 0;
      z-index: 2;
    }

    #pokemon,
    #shiny {
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      margin: 0 auto;
      cursor: pointer;
      transition: transform 0.3s ease;
      width: 80%;
      height: 80%;
      object-fit: contain;
      display: block;
      position: absolute;
      top: 10%;
      left: 50%;
      transform: translateX(-50%);
      image-rendering: auto;
      filter: drop-shadow(0 0 20px rgba(247, 217, 139, 0.3));
    }

    #pokemon {
      display: block;
    }
    #shiny {
      display: none;
    }

    #pokemon:active {
      transform: translateX(-50%) scale(0.92);
    }

    #shiny,
    #sparkle {
      display: none;
    }

    #sparkles {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 3;
    }

    /* ===== 🎀 卖萌对话框 ===== */
    #speech-bubble {
      position: absolute;
      top: -15%;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.95);
      border-radius: clamp(16px, 3vw, 24px);
      padding: clamp(8px, 1.5vw, 14px) clamp(14px, 3vw, 24px);
      min-width: clamp(50px, 15vw, 80px);
      max-width: clamp(140px, 40vw, 260px);
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.6), 0 0 0 3px #ffd700;
      pointer-events: none;
      z-index: 10;
      font-family: 'Comic Sans MS', 'Microsoft YaHei', cursive, sans-serif;
      font-size: clamp(13px, 3vw, 19px);
      font-weight: bold;
      color: #333;
      line-height: 1.3;
      opacity: 0;
      transition: opacity 0.3s ease, transform 0.3s ease;
      transform: translateX(-50%) scale(0.8);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    #speech-bubble.show {
      opacity: 1 !important;
      transform: translateX(-50%) scale(1) !important;
    }

    #speech-tail {
      position: absolute;
      bottom: clamp(-10px, -2vw, -18px);
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: clamp(8px, 2vw, 14px) solid transparent;
      border-right: clamp(8px, 2vw, 14px) solid transparent;
      border-top: clamp(10px, 2.5vw, 18px) solid rgba(255, 255, 255, 0.95);
    }

    #speech-bubble.happy {
      border-color: #ff6b9d;
      background: rgba(255, 240, 245, 0.95);
    }
    #speech-bubble.happy #speech-tail {
      border-top-color: rgba(255, 240, 245, 0.95);
    }
    #speech-bubble.excited {
      border-color: #ffd700;
      background: rgba(255, 255, 240, 0.95);
    }
    #speech-bubble.excited #speech-tail {
      border-top-color: rgba(255, 255, 240, 0.95);
    }
    #speech-bubble.shy {
      border-color: #87ceeb;
      background: rgba(240, 248, 255, 0.95);
    }
    #speech-bubble.shy #speech-tail {
      border-top-color: rgba(240, 248, 255, 0.95);
    }
    #speech-bubble.tsundere {
      border-color: #ff4500;
      background: rgba(255, 240, 240, 0.95);
    }
    #speech-bubble.tsundere #speech-tail {
      border-top-color: rgba(255, 240, 240, 0.95);
    }
    #speech-bubble.sleepy {
      border-color: #9b59b6;
      background: rgba(245, 240, 255, 0.95);
    }
    #speech-bubble.sleepy #speech-tail {
      border-top-color: rgba(245, 240, 255, 0.95);
    }

    /* ===== 😊 表情雨 ===== */
    #emoji-rain {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: 4;
    }

    .floating-emoji {
      position: absolute;
      font-size: clamp(20px, 5vw, 36px);
      animation: floatUp 2.2s ease-out forwards;
      pointer-events: none;
      text-shadow: 0 2px 20px rgba(255, 215, 0, 0.5);
    }

    @keyframes floatUp {
      0% {
        opacity: 1;
        transform: translateY(0) scale(0.5) rotate(0deg);
      }
      100% {
        opacity: 0;
        transform: translateY(-180px) scale(1.3) rotate(720deg);
      }
    }

    /* ===== 宝可梦动画 ===== */
    #shiny.happy {
      animation: happyHop 0.6s ease-in-out;
    }
    #shiny.shy {
      animation: shyWiggle 0.8s ease-in-out;
    }

    @keyframes happyHop {
      0%,
      100% {
        transform: translateX(-50%) translateY(0) rotate(0deg);
      }
      25% {
        transform: translateX(-50%) translateY(-18px) rotate(-8deg);
      }
      75% {
        transform: translateX(-50%) translateY(-10px) rotate(8deg);
      }
    }

    @keyframes shyWiggle {
      0%,
      100% {
        transform: translateX(-50%) rotate(0deg) scale(1);
      }
      25% {
        transform: translateX(-50%) rotate(-15deg) scale(0.9);
      }
      75% {
        transform: translateX(-50%) rotate(15deg) scale(0.9);
      }
    }

    #pokemons {
      font-size: clamp(13px, 2.8vw, 17px);
      -webkit-appearance: none;
      appearance: none;
      padding: clamp(8px, 1.5vw, 12px) clamp(30px, 6vw, 40px) clamp(8px, 1.5vw, 12px) clamp(14px, 3vw, 20px);
      border-radius: 30px;
      color: #f7d98b;
      background: rgba(8, 11, 36, 0.8);
      border: 1px solid rgba(247, 217, 139, 0.3);
      outline: none;
      margin: clamp(6px, 1.5vh, 12px) 0;
      cursor: pointer;
      font-family: inherit;
      position: relative;
      z-index: 5;
      width: min(280px, 80vw);
      max-width: 380px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.4);
    }

    #pokemons option {
      background: #0a0f2a;
      color: #f7d98b;
      font-size: 14px;
    }

    #stats {
      color: #f7d98b;
      font-family: 'Comic Sans MS', 'Microsoft YaHei', sans-serif;
      font-weight: 100;
      font-size: clamp(12px, 2.5vw, 15px);
      line-height: 1.7;
      margin: clamp(4px, 1vh, 8px) auto;
      text-align: right;
      position: relative;
      z-index: 5;
      width: min(300px, 85vw);
      max-width: 380px;
      background: rgba(8, 11, 36, 0.7);
      border-radius: 16px;
      padding: clamp(6px, 1.5vh, 10px) clamp(12px, 3vw, 20px);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(247, 217, 139, 0.15);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
    }

    #stats td {
      padding: clamp(1px, 0.3vh, 3px) clamp(3px, 0.8vw, 6px);
    }
    #stats td:last-child {
      text-align: left;
      width: clamp(40px, 12vw, 60px);
      font-weight: bold;
      color: #ffd700;
    }
    #stats td:first-child {
      text-align: right;
      padding-right: clamp(8px, 2vw, 14px);
      opacity: 0.7;
    }

    /* ===== 控制按钮 ===== */
    .controls {
      margin-top: clamp(4px, 1vh, 8px);
      display: flex;
      gap: clamp(6px, 1.5vw, 12px);
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      width: min(320px, 88vw);
      max-width: 400px;
      position: relative;
      z-index: 5;
    }

    .controls label {
      color: #f7d98b;
      font-size: clamp(11px, 2.5vw, 14px);
      font-family: inherit;
      cursor: pointer;
      background: rgba(8, 11, 36, 0.6);
      padding: clamp(4px, 1vh, 8px) clamp(10px, 2.5vw, 16px);
      border-radius: 20px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(247, 217, 139, 0.15);
      display: flex;
      align-items: center;
      gap: clamp(4px, 1vw, 8px);
    }

    .controls label input[type="checkbox"] {
      width: clamp(16px, 3vw, 20px);
      height: clamp(16px, 3vw, 20px);
      cursor: pointer;
      accent-color: #ffd700;
    }

    .controls button {
      background: rgba(8, 11, 36, 0.6);
      border: 1px solid rgba(247, 217, 139, 0.2);
      border-radius: 30px;
      color: #f7d98b;
      padding: clamp(6px, 1.5vh, 10px) clamp(14px, 3vw, 22px);
      font-family: inherit;
      font-size: clamp(11px, 2.5vw, 14px);
      cursor: pointer;
      transition: all 0.3s;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      white-space: nowrap;
      min-height: clamp(34px, 6vh, 44px);
      min-width: clamp(50px, 12vw, 70px);
      box-shadow: 0 2px 20px rgba(0, 0, 0, 0.3);
    }

    .controls button:active {
      transform: scale(0.92);
      background: rgba(247, 217, 139, 0.2);
    }

    .controls button#resetBtn {
      border-color: rgba(255, 100, 100, 0.3);
    }
    .controls button#resetBtn:active {
      background: rgba(255, 100, 100, 0.2);
    }
    .controls button#testBtn {
      border-color: rgba(255, 215, 0, 0.3);
    }
    .controls button#testBtn:active {
      background: rgba(255, 215, 0, 0.2);
    }
    .controls button#luckyBtn {
      border-color: rgba(0, 255, 200, 0.3);
      color: #7fffd4;
    }
    .controls button#luckyBtn:active {
      background: rgba(0, 255, 200, 0.15);
    }
    .controls button#autoBtn {
      border-color: rgba(255, 150, 255, 0.3);
      color: #ff99ff;
    }
    .controls button#autoBtn.active {
      background: rgba(255, 150, 255, 0.2);
      border-color: #ff99ff;
    }
    .controls button#autoBtn:active {
      background: rgba(255, 150, 255, 0.15);
    }

    /* ===== 🆕 AI 按钮 ===== */
    .controls button#aiBtn {
      border-color: rgba(100, 200, 255, 0.4);
      color: #87cefa;
      background: rgba(0, 100, 200, 0.2);
    }
    .controls button#aiBtn:active {
      background: rgba(0, 100, 200, 0.35);
    }
    .controls button#aiBtn.active {
      background: rgba(0, 150, 255, 0.25);
      border-color: #87cefa;
      box-shadow: 0 0 30px rgba(100, 200, 255, 0.2);
    }

    /* ===== 底部文字 ===== */
    #fun-message {
      color: rgba(247, 217, 139, 0.5);
      font-size: clamp(10px, 2vw, 13px);
      margin-top: clamp(6px, 1.5vh, 12px);
      position: relative;
      z-index: 5;
      text-align: center;
      text-shadow: 0 2px 20px rgba(0, 0, 0, 0.8);
      padding: 0 16px;
      min-height: 24px;
      letter-spacing: 0.1em;
      transition: all 0.5s;
      cursor: pointer;
    }
    #fun-message.pop {
      color: #ffd700;
      animation: msgPop 0.5s ease;
    }
    #fun-message.ai-thinking {
      color: #87cefa;
      animation: msgPulse 1s ease infinite;
    }
    @keyframes msgPop {
      0%,
      100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.1);
      }
    }
    @keyframes msgPulse {
      0%,
      100% {
        opacity: 0.6;
      }
      50% {
        opacity: 1;
      }
    }

    .sparkle-pop {
      position: fixed;
      pointer-events: none;
      z-index: 999;
      border-radius: 50%;
      animation: sparklePop 0.9s ease-out forwards;
    }

    @keyframes sparklePop {
      0% {
        transform: scale(0) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: scale(3) rotate(360deg);
        opacity: 0;
      }
    }

    #catch_screen.shake {
      animation: screenShake 0.5s ease;
    }

    @keyframes screenShake {
      0%,
      100% {
        transform: translateX(0);
      }
      10% {
        transform: translateX(-6px);
      }
      30% {
        transform: translateX(6px);
      }
      50% {
        transform: translateX(-4px);
      }
      70% {
        transform: translateX(4px);
      }
      90% {
        transform: translateX(-2px);
      }
    }

    #flash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: white;
      pointer-events: none;
      z-index: 100;
      opacity: 0;
    }

    /* ===== 🆕 AI 对话面板 ===== */
    #ai-panel {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(8, 11, 36, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 2px solid rgba(100, 200, 255, 0.3);
      padding: clamp(8px, 1.5vh, 16px) clamp(12px, 3vw, 24px);
      z-index: 300;
      transform: translateY(100%);
      transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55);
      max-height: 50vh;
      display: flex;
      flex-direction: column;
    }
    #ai-panel.open {
      transform: translateY(0);
    }

    #ai-panel .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #87cefa;
      font-size: clamp(12px, 2vw, 16px);
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      flex-shrink: 0;
    }
    #ai-panel .header .close-btn {
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.4);
      font-size: 20px;
      cursor: pointer;
      padding: 0 8px;
    }
    #ai-panel .header .close-btn:hover {
      color: #fff;
    }

    #ai-messages {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
      max-height: 30vh;
      min-height: 80px;
      scroll-behavior: smooth;
    }
    #ai-messages::-webkit-scrollbar {
      width: 4px;
    }
    #ai-messages::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.05);
    }
    #ai-messages::-webkit-scrollbar-thumb {
      background: rgba(100, 200, 255, 0.3);
      border-radius: 4px;
    }

    .ai-msg {
      margin: 4px 0;
      padding: 6px 12px;
      border-radius: 12px;
      font-size: clamp(12px, 1.8vw, 15px);
      line-height: 1.5;
      max-width: 90%;
      word-wrap: break-word;
      animation: msgSlideIn 0.3s ease;
    }
    .ai-msg.user {
      background: rgba(100, 200, 255, 0.15);
      color: #87cefa;
      margin-left: auto;
      text-align: right;
      border-bottom-right-radius: 4px;
    }
    .ai-msg.ai {
      background: rgba(255, 215, 0, 0.1);
      color: #f7d98b;
      margin-right: auto;
      border-bottom-left-radius: 4px;
    }
    .ai-msg.ai .label {
      color: rgba(255, 215, 0, 0.5);
      font-size: 0.7em;
      display: block;
      margin-bottom: 2px;
    }
    .ai-msg .typing {
      display: inline-block;
      animation: typingDots 1.2s infinite;
    }
    @keyframes typingDots {
      0%,
      20% {
        content: '.';
      }
      40% {
        content: '..';
      }
      60%,
      100% {
        content: '...';
      }
    }
    @keyframes msgSlideIn {
      0% {
        opacity: 0;
        transform: translateY(8px) scale(0.95);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    #ai-input-area {
      display: flex;
      gap: 8px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      flex-shrink: 0;
    }
    #ai-input {
      flex: 1;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: clamp(6px, 1vh, 10px) clamp(12px, 2vw, 16px);
      color: #f7d98b;
      font-family: inherit;
      font-size: clamp(12px, 1.8vw, 15px);
      outline: none;
      min-height: 36px;
    }
    #ai-input:focus {
      border-color: rgba(100, 200, 255, 0.4);
    }
    #ai-input::placeholder {
      color: rgba(255, 255, 255, 0.2);
    }
    #ai-send-btn {
      background: rgba(100, 200, 255, 0.15);
      border: 1px solid rgba(100, 200, 255, 0.2);
      border-radius: 20px;
      color: #87cefa;
      padding: clamp(6px, 1vh, 10px) clamp(14px, 2vw, 20px);
      font-family: inherit;
      font-size: clamp(12px, 1.8vw, 15px);
      cursor: pointer;
      transition: all 0.3s;
      white-space: nowrap;
    }
    #ai-send-btn:active {
      transform: scale(0.92);
      background: rgba(100, 200, 255, 0.25);
    }
    #ai-send-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* ===== 星星计数器 ===== */
    #star-counter {
      position: fixed;
      top: clamp(6px, 1.5vh, 12px);
      right: clamp(8px, 2vw, 16px);
      color: rgba(247, 217, 139, 0.3);
      font-size: clamp(10px, 1.5vw, 13px);
      font-family: 'Comic Sans MS', sans-serif;
      z-index: 10;
      pointer-events: none;
      text-align: right;
      line-height: 1.4;
      letter-spacing: 0.05em;
      text-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
    }
    #star-counter span {
      color: #ffd700;
      font-weight: bold;
    }

    /* ===== 🆕 成就徽章 ===== */
    #achievement {
      position: fixed;
      bottom: 50%;
      left: 50%;
      transform: translate(-50%, 50%) scale(0);
      background: rgba(8, 11, 36, 0.92);
      border: 2px solid #ffd700;
      border-radius: 20px;
      padding: clamp(12px, 2vh, 20px) clamp(20px, 4vw, 40px);
      color: #ffd700;
      font-family: 'Comic Sans MS', sans-serif;
      font-size: clamp(16px, 3vw, 24px);
      z-index: 200;
      pointer-events: none;
      text-align: center;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 0 60px rgba(255, 215, 0, 0.2);
      transition: all 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55);
      opacity: 0;
      min-width: 200px;
    }
    #achievement.show {
      transform: translate(-50%, 50%) scale(1);
      opacity: 1;
    }
    #achievement .sub {
      font-size: clamp(11px, 1.5vw, 14px);
      color: rgba(247, 217, 139, 0.6);
      margin-top: 4px;
    }

    /* ===== 响应式 ===== */
    @media (max-width: 480px) {
      #encounter {
        width: min(150px, 45vw);
        height: min(150px, 45vw);
      }
      #speech-bubble {
        top: -12%;
        font-size: 13px;
        padding: 6px 12px;
        max-width: 130px;
        min-width: 40px;
        border-width: 2.5px;
      }
      #speech-tail {
        border-left: 8px solid transparent;
        border-right: 8px solid transparent;
        border-top: 12px solid rgba(255, 255, 255, 0.95);
      }
      #stats {
        padding: 4px 10px;
        font-size: 11px;
        line-height: 1.5;
        width: min(260px, 90vw);
      }
      #stats td:last-child {
        width: 35px;
      }
      .controls button {
        font-size: 11px;
        padding: 4px 10px;
        min-height: 32px;
        min-width: 44px;
      }
      .controls label {
        font-size: 11px;
        padding: 4px 8px;
      }
      #pokemons {
        font-size: 12px;
        padding: 6px 24px 6px 12px;
        width: min(220px, 85vw);
      }
      #fun-message {
        font-size: 10px;
        min-height: 18px;
      }
      #star-counter {
        font-size: 9px;
        top: 4px;
        right: 6px;
      }
      #achievement {
        font-size: 14px;
        padding: 10px 16px;
        min-width: 150px;
      }
      #achievement .sub {
        font-size: 10px;
      }
      #ai-panel {
        padding: 6px 10px;
        max-height: 45vh;
      }
      #ai-messages {
        max-height: 25vh;
        min-height: 60px;
      }
      .ai-msg {

          [cx + r * 0.8, cy + r * 0.2],

          [0, 4]
        ]
      }];

      const zodiacNames = ['白羊', '金牛', '双子', '巨蟹', '狮子', '处女', '天秤', '天蝎', '射手', '摩羯', '水瓶', '双鱼'];
      let zodiacConstellations = [];

      function generateZodiacRing() {
        const constellations = [];
        const isSmall = Math.min(width, height) < 600;
        const ringRadius = isSmall ? 0.32 : 0.38;
        const centerX = 0.5,
          centerY = 0.5;
        const sizeScale = isSmall ? 0.7 : 1.0;

        for (let i = 0; i < zodiacData.length; i++) {
          const angle = (i / zodiacData.length) * Math.PI * 2 - Math.PI / 2;
          const cx = centerX + ringRadius * Math.cos(angle);
          const cy = centerY + ringRadius * Math.sin(angle);
          const r = (0.045 + 0.01 * Math.sin(i * 1.3)) * sizeScale;

          const data = zodiacData[i];
          const points = data.points(cx, cy, r);
          const lines = data.lines;

          constellations.push({
            name: zodiacNames[i],
            points: points,
            lines: lines,
            angle: angle
          });
        }
        return constellations;
      }

      function initConstellations() {
        zodiacConstellations = generateZodiacRing();
      }

      function resize() {
        const ratio = Math.min(window.devicePixelRatio || 1, 2);
        width = innerWidth;
        height = innerHeight;
        canvas.width = width * ratio;
        canvas.height = height * ratio;
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        ctx.setTransform(ratio, 0, 0, ratio, 0, 0);

        isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window
          .innerWidth < 768;

        const starCount = isMobile ?
          Math.min(200, Math.floor(width * height / 6000)) :
          Math.min(380, Math.floor(width * height / 4800));

        stars = Array.from({ length: starCount }, () => ({
          x: Math.random() * width,
          y: Math.random() * height,
          r: Math.random() * 1.5 + .25,
          a: Math.random() * Math.PI * 2,
          speed: Math.random() * .018 + .004,
          twinkle: Math.random() * .7 + .3,
          color: colors[Math.floor(Math.random() * colors.length)]
        }));

        document.getElementById('starCount').textContent = stars.length;
        initConstellations();
      }

      function addShootingStar() {
        const rate = isMobile ? 0.008 : 0.012;
        if (shooting.length < (isMobile ? 1 : 2) && Math.random() < rate) {
          shooting.push({
            x: Math.random() * width * .8 + width * .1,
            y: Math.random() * height * .35,
            vx: -(Math.random() * 7 + 8),
            vy: Math.random() * 4 + 4,
            life: 1
          });
        }
      }

      function drawConstellations() {
        const offsetX = (pointer.x - width / 2) * .0015;
        const offsetY = (pointer.y - height / 2) * .0015;

        zodiacConstellations.forEach((constellation, idx) => {
          const points = constellation.points.map(([x, y]) => ({
            x: x * width + offsetX,
            y: y * height + offsetY
          }));

          const strokeColor = 'rgba(247, 217, 139, .35)';
          const fillColor = 'rgba(255, 244, 194, .7)';
          const shadowColor = 'rgba(247, 217, 139, .5)';
          const pointRadius = isMobile ? 1.8 : 2.4;

          ctx.strokeStyle = strokeColor;
          ctx.lineWidth = isMobile ? 0.8 : 1.2;
          ctx.shadowBlur = 0;
          ctx.beginPath();
          constellation.lines.forEach(([a, b]) => {
            ctx.moveTo(points[a].x, points[a].y);
            ctx.lineTo(points[b].x, points[b].y);
          });
          ctx.stroke();

          points.forEach(point => {
            ctx.fillStyle = fillColor;
            ctx.shadowColor = shadowColor;
            ctx.shadowBlur = isMobile ? 4 : 8;
            ctx.beginPath();
            ctx.arc(point.x, point.y, pointRadius, 0, Math.PI * 2);
            ctx.fill();
          });
          ctx.shadowBlur = 0;

          if (!isMobile) {
            const cx = points.reduce((s, p) => s + p.x, 0) / points.length;
            const cy = points.reduce((s, p) => s + p.y, 0) / points.length;
            ctx.fillStyle = 'rgba(247, 217, 139, .25)';
            const fontSize = Math.min(width, height) * 0.012;
            ctx.font = `${fontSize}px "Noto Sans SC", sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowBlur = 6;
            ctx.shadowColor = 'rgba(247, 217, 139, .15)';
            ctx.fillText(constellation.name || '', cx, cy + Math.min(width, height) * 0.025);
            ctx.shadowBlur = 0;
          }
        });

        ctx.strokeStyle = isMobile ? 'rgba(247, 217, 139, .03)' : 'rgba(247, 217, 139, .06)';
        ctx.lineWidth = isMobile ? 0.5 : 1;
        ctx.setLineDash([4, 8]);
        ctx.beginPath();
        const ringRadius = isMobile ? 0.32 : 0.38;
        const rx = ringRadius * width;
        const ry = ringRadius * height;
        ctx.ellipse(width * 0.5 + offsetX, height * 0.5 + offsetY, rx, ry, 0, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      function drawStars() {
        stars.forEach(s => {
          s.a += s.speed;
          const pulse = (Math.sin(s.a) + 1) / 2;
          const alpha = .24 + pulse * (.68 * s.twinkle);
          const radius = s.r * (.88 + pulse * .5);
          ctx.globalAlpha = alpha;
          ctx.fillStyle = s.color;
          if (pulse > .78 && s.r > 1) {
            ctx.shadowColor = s.color;
            ctx.shadowBlur = 8 + pulse * 12;
          } else {
            ctx.shadowBlur = 0;
          }
          ctx.beginPath();
          ctx.arc(s.x + (pointer.x - width / 2) * .003, s.y + (pointer.y - height / 2) * .003, radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.shadowBlur = 0;
        });
      }

      function drawShootingStars() {
        shooting.forEach((s, i) => {
          const tail = isMobile ? 60 : 90;
          const grad = ctx.createLinearGradient(s.x, s.y, s.x - s.vx * tail / 10, s.y - s.vy * tail / 10);
          grad.addColorStop(0, 'rgba(255,244,194,' + s.life + ')');
          grad.addColorStop(1, 'rgba(220,168,92,0)');
          ctx.strokeStyle = grad;
          ctx.lineWidth = isMobile ? 1.5 : 2;
          ctx.shadowBlur = 0;
          ctx.beginPath();
          ctx.moveTo(s.x, s.y);
          ctx.lineTo(s.x - s.vx * tail / 10, s.y - s.vy * tail / 10);
          ctx.stroke();
          s.x += s.vx;
          s.y += s.vy;
          s.life -= isMobile ? 0.025 : 0.018;
          if (s.life <= 0) shooting.splice(i, 1);
        });
      }

        gradient.addColorStop(.45, '#111b4b');
        gradient.addColorStop(1, '#080b24');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, width, height);
      }

      function animate() {
        drawBackground();
        drawConstellations();
        drawStars();
        drawShootingStars();
        addShootingStar();
        requestAnimationFrame(animate);
      }

      function handlePointerMove(x, y) {

        if (touch) handlePointerMove(touch.clientX, touch.clientY);
      }, { passive: false });
      window.addEventListener('touchstart', e => {
        const touch = e.touches[0];
        if (touch) handlePointerMove(touch.clientX, touch.clientY);
      }, { passive: true });

      resize();
      animate();

      function getAIResponse(input) {
        var lower = input.toLowerCase();

        // 关键词匹配
        if (lower.includes('运气') || lower.includes('欧') || lower.includes('非') || lower.includes('气') || lower.includes(
            '概率') || lower.includes('几率')) {
          return aiResponses.luck[Math.floor(Math.random() * aiResponses.luck.length)];
        }
        if (lower.includes('鼓励') || lower.includes('加油') || lower.includes('坚持') || lower.includes('累') || lower.includes(
            '放弃') || lower.includes('想哭')) {
          return aiResponses.encourage[Math.floor(Math.random() * aiResponses.encourage.length)];
        }
        if (lower.includes('预测') || lower.includes('什么时候') || lower.includes('多久') || lower.includes('未来') || lower
          .includes('将会')) {
          return aiResponses.predict[Math.floor(Math.random() * aiResponses.predict.length)];
        }
        if (lower.includes('知识') || lower.includes('知道') || lower.includes('历史') || lower.includes('传说') || lower
          .includes('背景') || lower.includes('故事')) {
          return aiResponses.trivia[Math.floor(Math.random() * aiResponses.trivia.length)];
        }
        if (lower.includes('你好') || lower.includes('嗨') || lower.includes('hi') || lower.includes('hello') || lower
          .includes('在吗') || lower.includes('聊')) {
          return aiResponses.chat[Math.floor(Math.random() * aiResponses.chat.length)];
        }

        // 特殊处理：询问当前状态
        if (lower.includes('闪了多少') || lower.includes('多少闪') || lower.includes('统计')) {
          return '📊 目前你已经遭遇了 ' + encounters + ' 只宝可梦，其中 ' + shinies +
            ' 只是闪光的！闪光率是 ' + (encounters > 0 ? (shinies / encounters * 100).toFixed(2) : '0.00') +
            '%。继续加油！';
        }

        // 随机默认回复
        return aiResponses.default[Math.floor(Math.random() * aiResponses.default.length)];
      }

      // ===== AI 对话 =====
      function addAIMessage(text, sender) {
        var div = document.createElement('div');
        div.className = 'ai-msg ' + (sender === 'user' ? 'user' : 'ai');
        if (sender === 'ai') {
          div.innerHTML = '<span class="label">🧠 AI 占卜师</span>' + text;
        } else {
          div.textContent = text;
        }
        aiMessages.appendChild(div);
        aiMessages.scrollTop = aiMessages.scrollHeight;
      }

      function toggleAI() {
        isAIOpen = !isAIOpen;
        aiPanel.className = isAIOpen ? 'open' : '';
        aiBtn.textContent = isAIOpen ? '🧠 AI ✕' : '🧠 AI';
        aiBtn.className = isAIOpen ? 'active' : '';
        if (isAIOpen) {
          aiInput.focus();
        }
      }

      function sendAIMessage() {
        var text = aiInput.value.trim();
        if (!text || isThinking) return;

        addAIMessage(text, 'user');
        aiInput.value = '';
        aiInput.disabled = true;
        aiSendBtn.disabled = true;
        isThinking = true;

        // 显示思考状态
        var thinkingDiv = document.createElement('div');
        thinkingDiv.className = 'ai-msg ai';
        thinkingDiv.id = 'thinking-msg';
        thinkingDiv.innerHTML = '<span class="label">🧠 AI 占卜师</span>思考中<span class="typing">...</span>';
        aiMessages.appendChild(thinkingDiv);
        aiMessages.scrollTop = aiMessages.scrollHeight;

        // 模拟 AI 思考延迟 (0.5-1.5秒)
        var delay = 500 + Math.random() * 1000;
        setTimeout(function() {
          // 移除思考提示
          var thinkingEl = document.getElementById('thinking-msg');
          if (thinkingEl) thinkingEl.remove();

          var response = getAIResponse(text);
          addAIMessage(response, 'ai');

          isThinking = false;
          aiInput.disabled = false;
          aiSendBtn.disabled = false;
          aiInput.focus();
        }, delay);
      }

      pokemon_selector.onchange = function() {
        current = this.value;
        odds = pokemons[current][1];
        var displayNum = current;
        if (displayNum < 10) displayNum = "00" + displayNum;
        else if (displayNum < 100) displayNum = "0" + displayNum;
        pokemon.src = "https://github.com/ZeChrales/PogoAssets/blob/master/pokemon_icons/pokemon_icon_" + displayNum +
          "_00.png?raw=true";
        shiny.src = "https://github.com/ZeChrales/PogoAssets/blob/master/pokemon_icons/pokemon_icon_" + displayNum +
          "_00_shiny.png?raw=true";
        encounters = shinies = streak = worst_streak = 0;
        best_streak = "-";
        totalShinyStars = 0;
        document.getElementById('shinyStarCount').textContent = '0';
        updateStats();
      }
      pokemon_selector.onchange();

      function autocheck() {
        autochecking = true;
        autochecker = setInterval(reveal, 5);
      }

      function updateStats() {
        encounters_stat.textContent = encounters;
        shinies_stat.textContent = shinies;
        streak_stat.textContent = streak;
        worst_streak_stat.textContent = worst_streak;
        best_streak_stat.textContent = best_streak;
        if (encounters > 0 && shinies > 0) {
          rate_stat.textContent = (shinies / encounters * 100).toFixed(2) + '%';
        } else if (encounters > 0) {
          rate_stat.textContent = '0.00%';
        } else {
          rate_stat.textContent = '-';
        }
      }

      function reveal() {
        encounters++;

        if (shiny.style.display == "block") streak = 0;
        streak++;
        if (streak > worst_streak) worst_streak = streak;

        var currentOdds = odds;
        if (luckyDay) {
          currentOdds = Math.floor(odds / 3);
        }

        if (Math.ceil(Math.random() * currentOdds) == currentOdds) {
          shinies++;
          sparkling = true;
          clearInterval(autochecker);
          if (best_streak > streak || best_streak == "-") best_streak = streak;

          pokemon.style.display = "none";
          shiny.style.display = "block";

          setTimeout(function() { shinyCuteReveal(); }, 300);
          setTimeout(shine, 400);

        } else {
          pokemon.style.display = "block";
          shiny.style.display = "none";
        }

        updateStats();

        flash.style.transition = "opacity 0.4s";
        flash.style.opacity = 0;
      }

      // ===== 闪光粒子 =====
      var sparkle = document.getElementById("sparkle");
      var sparkles = document.getElementById("sparkles");
      var ctx = sparkles.getContext("2d");
      var particles = [];
      var drawer;

      function addSparkles() {
        for (var i = 0; i < 8; i++) particles.push({ "scale": 1, "radius": 60, "angle": 45 * i });
      }

      function drawSparkles() {
        ctx.clearRect(0, 0, 256, 256);
        for (var i = 0; i < particles.length; i++) {
          var p = particles[i];
          var x = 128 + p.radius * Math.cos(p.angle * Math.PI / 180);
          var y = 128 + p.radius * Math.sin(p.angle * Math.PI / 180);
          var scaled = Math.max(32 * p.scale, 0);
          ctx.drawImage(sparkle, x - scaled / 2, y - scaled / 2, scaled, scaled);
          if (p.scale > 0.6) p.scale -= 0.2;
          else p.scale -= 0.05;
          p.angle -= 5;
          p.radius += 5;
        }
      }

      function stopDrawing() {
        clearInterval(drawer);
        particles = [];
        sparkling = false;
      }

      function shine() {
        if (!particles.length) {
          for (var i = 0; i < 5; i++) {
            (function(index) {
              setTimeout(addSparkles, index * 100);
            })(i);
          }
          drawer = setInterval(drawSparkles, 50);
          setTimeout(stopDrawing, 1000);
        }
      }

      // ===== 控制 =====
      document.getElementById("noflash").onchange = function() {
        noflash = this.checked;
      }

      document.getElementById("resetBtn").onclick = function() {
        encounters = shinies = streak = worst_streak = 0;
        best_streak = "-";
        totalShinyStars = 0;
        document.getElementById('shinyStarCount').textContent = '0';
        achievements = {
          firstShiny: false,
          tenShinies: false,
          hundredEncounters: false,
          thousandEncounters: false,
          fiftyStreak: false,
          hundredStreak: false,
          luckyDayUsed: achievements.luckyDayUsed || false
        };
        updateStats();
        shiny.style.display = "none";
        pokemon.style.display = "block";
        speechBubble.className = '';
        emojiRain.innerHTML = '';
        if (autoMode) {
          autoMode = false;
          document.getElementById('autoBtn').textContent = '🤖 自动';
          document.getElementById('autoBtn').className = '';
          clearInterval(autoTimer);
        }
        funMessage.textContent = '🔄 已重置！重新开始吧！';
        // 清空AI对话
        aiMessages.innerHTML =
          '<div class="ai-msg ai"><span class="label">🧠 AI 占卜师</span>👋 重置了！让我们重新开始吧！<br>告诉我你的情况，我可以帮你分析运气、预测出闪！</div>';
      }

      document.body.onkeydown = function(e) {
        if (e.keyCode == 32 && !sparkling) {
          e.preventDefault();
          reveal();
        }
        if (e.keyCode == 76) { activateLuckyDay(); }
        if (e.keyCode == 65) { toggleAutoMode(); }
        if (e.keyCode == 82) { randomEncounter(); }
        if (e.keyCode == 73) { // I 键打开AI
          e.preventDefault();
          toggleAI();
        }
        if (e.keyCode == 27 && isAIOpen) { // ESC 关闭AI
          toggleAI();
        }
      }

      pokemon.oncontextmenu = function(e) {
        e.preventDefault();
        return false;
      }

      // ===== 暴露全局 =====
      window.shinyCuteReveal = shinyCuteReveal;
      window.showSpeechBubble = showSpeechBubble;
      window.activateLuckyDay = activateLuckyDay;
      window.toggleAutoMode = toggleAutoMode;
      window.randomEncounter = randomEncounter;
      window.toggleAI = toggleAI;
      window.sendAIMessage = sendAIMessage;

      console.log('✨ 星空闪光宝可梦 + AI 已启动！');
      console.log('💫 在星空中寻找你的闪光宝可梦吧！');
      console.log('🧠 点击 "AI" 按钮与闪光占卜师对话！');
      console.log('⌨️  快捷键: [L]幸运日 [A]自动 [R]随机遭遇 [I]打开AI [ESC]关闭AI');
      console.log('💡 点击底部文字5次快速召唤AI占卜师！');
    })();
  </script>

</body>
