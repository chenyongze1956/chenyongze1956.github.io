
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Public Chain Dashboard - Multi-Asset Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#3B82F6', eos: '#1a1a1a', success: '#10B981', danger: '#EF4444' },
                    boxShadow: { 'custom': '0 4px 25px rgba(0, 0, 0, 0.12)' }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .glass-card { @apply bg-white/75 backdrop-blur-lg border border-white/40 shadow-custom; }
            .active-currency { @apply bg-primary text-white scale-105 shadow-md; }
            .badge-public { @apply text-[9px] px-1.5 py-0.5 rounded bg-blue-100 text-blue-600 font-bold uppercase mr-1.5; }
            .badge-stable { @apply text-[9px] px-1.5 py-0.5 rounded bg-green-100 text-green-600 font-bold uppercase mr-1.5; }
        }
    </style>
</head>
<body class="p-2 md:p-6 bg-fixed min-h-screen" style="background: linear-gradient(45deg,#ff7e5f,#feb47b,#ffed86,#9feb8f,#5fbfff,#9b8eff);">
    
    <header class="container mx-auto mb-4 md:mb-6">
        <div class="glass-card rounded-xl md:rounded-2xl p-3 md:p-4 flex flex-wrap justify-between items-center gap-2">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-black rounded-full flex items-center justify-center text-white font-bold italic shadow-xl border-2 border-white/50">P</div>
                <div>
                    <h1 class="text-lg md:text-xl font-black tracking-tight text-gray-800 leading-none">PUBLIC <span class="text-primary">CHAIN</span></h1>
                    <p class="text-[9px] text-gray-500 font-bold uppercase tracking-widest mt-1">Permissionless & Transparent</p>
                </div>
            </div>
            
            <div class="flex items-center gap-2 md:gap-4">
                <div id="ws-status" class="flex items-center gap-1.5 px-3 py-1 rounded-full bg-black/5 border border-black/5">
                    <span class="w-2 h-2 rounded-full bg-blue-500 animate-pulse shadow-[0_0_8px_#3B82F6]"></span>
                    <span class="text-[9px] md:text-[10px] font-bold text-gray-600 uppercase tracking-tighter">Chain Realtime</span>
                </div>
                <div class="flex bg-black/5 p-1 rounded-lg" id="currency-toggle">
                    <button class="px-3 md:px-5 py-1 rounded-md text-[10px] md:text-xs font-bold transition-all active-currency" data-curr="usd">USD</button>
                    <button class="px-3 md:px-5 py-1 rounded-md text-[10px] md:text-xs font-bold transition-all" data-curr="cny">CNY</button>
                </div>
            </div>
        </div>
        
        <div class="mt-2 flex justify-between px-3 text-[10px] font-bold text-gray-800/60 uppercase">
            <span><i class="fa fa-cube mr-1"></i>Height: <span id="eos-block-mobile" class="text-gray-900">#---</span></span>
            <span><i class="fa fa-microchip mr-1"></i>RAM: <span id="eos-ram-mobile" class="text-gray-900">-.-- EOS/KB</span></span>
        </div>
    </header>

    <main class="container mx-auto space-y-4 md:space-y-6">
        <section class="grid grid-cols-2 md:grid-cols-4 gap-3 md:gap-4">
            <div class="glass-card p-3 md:p-5 rounded-xl md:rounded-2xl border-l-4 border-primary">
                <p class="text-[9px] md:text-[10px] font-bold text-gray-400 uppercase tracking-tighter">EOS Mainnet</p>
                <div class="flex flex-col md:flex-row md:items-baseline gap-0 md:gap-2 mt-1">
                    <h2 id="eos-live-price" class="text-xl md:text-3xl font-black font-mono text-gray-800 tracking-tighter truncate">--.---</h2>
                    <span id="eos-live-change" class="text-[10px] md:text-sm font-bold">--.--%</span>
                </div>
            </div>
            <div class="glass-card p-3 md:p-5 rounded-xl md:rounded-2xl border-l-4 border-red-500">
                <p class="text-[9px] md:text-[10px] font-bold text-gray-400 uppercase truncate text-adaptive">上证指数 (SH)</p>
                <div class="flex flex-col md:flex-row md:items-baseline gap-0 md:gap-2 mt-1">
                    <h2 id="sh-price" class="text-xl md:text-3xl font-black font-mono text-danger tracking-tighter truncate">----.--</h2>
                    <span id="sh-change" class="text-[10px] md:text-sm font-bold text-danger">--.--%</span>
                </div>
            </div>
            <div class="glass-card p-3 md:p-5 rounded-xl md:rounded-2xl border-l-4 border-green-500">
                <p class="text-[9px] md:text-[10px] font-bold text-gray-400 uppercase truncate text-adaptive">深证成指 (SZ)</p>
                <div class="flex flex-col md:flex-row md:items-baseline gap-0 md:gap-2 mt-1">
                    <h2 id="sz-price" class="text-xl md:text-3xl font-black font-mono text-success tracking-tighter truncate">----.--</h2>
                    <span id="sz-change" class="text-[10px] md:text-sm font-bold text-success">--.--%</span>
                </div>
            </div>
            <div class="glass-card p-3 md:p-5 rounded-xl md:rounded-2xl border-l-4 border-purple-500">
                <p class="text-[9px] md:text-[10px] font-bold text-gray-400 uppercase truncate text-adaptive">创业板指 (CYB)</p>
                <div class="flex flex-col md:flex-row md:items-baseline gap-0 md:gap-2 mt-1">
                    <h2 id="cyb-price" class="text-xl md:text-3xl font-black font-mono text-purple-600 tracking-tighter truncate">----.--</h2>
                    <span id="cyb-change" class="text-[10px] md:text-sm font-bold text-purple-600">--.--%</span>
                </div>
            </div>
        </section>

        <section class="glass-card rounded-xl md:rounded-2xl p-4 md:p-6">
            <div class="flex justify-between items-center mb-4">
                <div>
                    <h2 id="chart-title" class="text-sm md:text-xl font-bold text-gray-800 tracking-tight">Public Asset Trend</h2>
                    <div id="chart-price" class="text-lg md:text-2xl font-mono font-black text-primary">---</div>
                </div>
                <div class="text-[8px] md:text-[10px] font-bold text-blue-600 bg-blue-100/50 px-2.5 py-1 rounded-full uppercase tracking-widest">Global Verified</div>
            </div>
            <div class="relative h-[220px] md:h-[320px] w-full">
                <canvas id="trendChart"></canvas>
            </div>
        </section>

        <section class="glass-card rounded-xl md:rounded-2xl overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left table-fixed md:table-auto">
                    <thead class="bg-black/5 text-gray-400 text-[10px] uppercase font-black">
                        <tr>
                            <th class="px-5 py-4 w-[40%] tracking-widest">Distributed Asset</th>
                            <th class="px-5 py-4 text-right tracking-widest">Market Price</th>
                            <th class="px-5 py-4 text-right tracking-widest">24H Status</th>
                        </tr>
                    </thead>
                    <tbody id="crypto-table-body" class="divide-y divide-gray-100 font-bold text-xs md:text-sm text-gray-700"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
        // 加入了 USDT 监控的 API
        const MARKET_API = 'https://min-api.cryptocompare.com/data/pricemultifull?fsyms=EOS,BTC,ETH,BNB,SOL,USDT&tsyms=USD';
        const STOCK_API = 'https://qt.gtimg.cn/q=s_sh000001,s_sz399001,s_sz399006';
        const EOS_NODES = ['https://eos.greymass.com', 'https://api.main.alohaeos.com', 'https://eos.api.eosnation.io'];
        
        let currentCurrency = 'usd';
        let exchangeRate = 7.25;
        let cryptoData = {}; 
        let trendChart = null;
        let selectedSym = 'EOS';
        const coinIds = { EOS: 'eos', BTC: 'bitcoin', ETH: 'ethereum', BNB: 'binancecoin', SOL: 'solana', USDT: 'tether' };

        document.addEventListener('DOMContentLoaded', () => {
            initChart();
            fetchExchangeRate();
            fetchStockData();
            fetchMarketData();
            fetchEOSChainData();
            setInterval(fetchMarketData, 6000);
            setInterval(fetchStockData, 10000);
            setInterval(fetchEOSChainData, 8000); 
            setTimeout(() => fetchTrendData('EOS'), 1000);
            setupCurrencyToggle();
        });

        async function fetchEOSChainData() {
            const baseUrl = EOS_NODES[Math.floor(Math.random() * EOS_NODES.length)];
            try {
                const infoRes = await fetch(`${baseUrl}/v1/chain/get_info`);
                const info = await infoRes.json();
                if(info.head_block_num) {
                    document.getElementById('eos-block-mobile').innerText = `#${info.head_block_num.toLocaleString()}`;
                }
                const ramRes = await fetch(`${baseUrl}/v1/chain/get_table_rows`, {
                    method: 'POST',
                    body: JSON.stringify({ json: true, code: 'eosio', scope: 'eosio', table: 'rammarket', limit: 1 })
                });
                const ramData = await ramRes.json();
                if (ramData.rows && ramData.rows[0]) {
                    const row = ramData.rows[0];
                    const price = (parseFloat(row.quote.balance) / parseFloat(row.base.balance) * 1024).toFixed(4);
                    document.getElementById('eos-ram-mobile').innerText = `${price} EOS/KB`;
                }
            } catch (e) { }
        }

        async function fetchMarketData() {
            try {
                const res = await fetch(MARKET_API);
                const json = await res.json();
                const raw = json.RAW;
                ['EOS', 'BTC', 'ETH', 'BNB', 'SOL', 'USDT'].forEach(sym => {
                    const data = raw[sym].USD;
                    handleMarketData({ s: sym, c: data.PRICE, P: data.CHANGEPCT24HOUR });
                });
            } catch (e) { }
        }

        function handleMarketData(data) {
            const symbol = data.s;
            cryptoData[symbol] = { price: data.c, change: data.P };
            updateUI(symbol);
            if(symbol === 'EOS') {
                const rate = currentCurrency === 'usd' ? 1 : exchangeRate;
                document.getElementById('eos-live-price').innerText = (data.c * rate).toFixed(3);
                const ec = document.getElementById('eos-live-change');
                ec.innerText = `${data.P >= 0 ? '+' : ''}${data.P.toFixed(2)}%`;
                ec.className = `text-[10px] md:text-sm font-bold ${data.P >= 0 ? 'text-success' : 'text-danger'}`;
            }
            if(symbol === selectedSym) {
                const unit = currentCurrency === 'usd' ? '$' : '¥';
                const rate = currentCurrency === 'usd' ? 1 : exchangeRate;
                document.getElementById('chart-price').innerText = unit + (data.c * rate).toLocaleString(undefined, {minimumFractionDigits: 2});
            }
        }

        function updateUI(sym) {
            const tbody = document.getElementById('crypto-table-body');
            let row = document.getElementById(`row-${sym}`);
            const data = cryptoData[sym];
            if (!data) return;
            if (!row) {
                row = document.createElement('tr');
                row.id = `row-${sym}`;
                row.className = "hover:bg-primary/5 cursor-pointer border-b border-gray-100 transition-all active:scale-[0.98]";
                row.onclick = () => fetchTrendData(sym);
                tbody.appendChild(row);
            }
            const unit = currentCurrency === 'usd' ? '$' : '¥';
            const rate = currentCurrency === 'usd' ? 1 : exchangeRate;
            
            // USDT 标记为 Stable，其他标记为 Public
            const badgeClass = sym === 'USDT' ? 'badge-stable' : 'badge-public';
            const badgeText = sym === 'USDT' ? 'Stable' : 'Public';

            row.innerHTML = `
                <td class="px-5 py-4 truncate">
                    <span class="${badgeClass}">${badgeText}</span><span class="text-gray-900">${sym}</span>
                </td>
                <td class="px-5 py-4 text-right font-mono font-black whitespace-nowrap">
                    ${unit}${(data.price * rate).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: sym==='USDT'?4:2})}
                </td>
                <td class="px-5 py-4 text-right ${data.change >= 0 ? 'text-success' : 'text-danger'} whitespace-nowrap font-black">
                    ${data.change >= 0 ? '▲' : '▼'} ${Math.abs(data.change).toFixed(2)}%
                </td>
            `;
        }

        function initChart() {
            const ctx = document.getElementById('trendChart').getContext('2d');
            trendChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: Array(24).fill(''),
                    datasets: [{ 
                        label: 'Price', 
                        data: [], 
                        borderColor: '#3B82F6', 
                        backgroundColor: 'rgba(59, 130, 246, 0.1)', 
                        borderWidth: 3, 
                        fill: true, 
                        tension: 0.4, 
                        pointRadius: 0,
                        pointHoverRadius: 4
                    }]
                },
                options: { 
                    responsive: true, 
                    maintainAspectRatio: false, 
                    plugins: { legend: { display: false }, tooltip: { enabled: true } }, 
                    scales: { x: { display: false }, y: { border: { display: false }, grid: { color: 'rgba(0,0,0,0.03)' }, ticks: { font: { size: 10, weight: 'bold' } } } } 
                }
            });
        }

        async function fetchTrendData(sym) {
            selectedSym = sym;
            const coinId = coinIds[sym];
            document.getElementById('chart-title').innerText = `${sym} Public Trend`;
            try {
                const res = await fetch(`https://api.coingecko.com/api/v3/coins/${coinId}/market_chart?vs_currency=usd&days=1`);
                const data = await res.json();
                const rate = currentCurrency === 'usd' ? 1 : exchangeRate;
                const prices = data.prices.filter((_, i) => i % 6 === 0).map(p => p[1] * rate);
                trendChart.data.datasets[0].data = prices;
                trendChart.update();
            } catch (e) { }
        }

        async function fetchExchangeRate() {
            try {
                const res = await fetch('https://api.exchangerate-api.com/v4/latest/USD');
                const data = await res.json();
                exchangeRate = data.rates.CNY;
            } catch (e) { }
        }

        async function fetchStockData() {
            try {
                const res = await fetch(STOCK_API);
                const text = await res.text();
                const stocks = text.split(';');
                const update = (raw, id) => {
                    const d = raw.split('~'); if(d.length < 6) return;
                    document.getElementById(`${id}-price`).innerText = d[3];
                    document.getElementById(`${id}-change`).innerText = (parseFloat(d[5]) >= 0 ? '+' : '') + d[5] + '%';
                };
                update(stocks[0], 'sh'); update(stocks[1], 'sz'); update(stocks[2], 'cyb');
            } catch (e) { }
        }

        function setupCurrencyToggle() {
            document.querySelectorAll('#currency-toggle button').forEach(btn => {
                btn.onclick = () => {
                    document.querySelectorAll('#currency-toggle button').forEach(b => b.classList.remove('active-currency'));
                    btn.classList.add('active-currency');
                    currentCurrency = btn.dataset.curr;
                    Object.keys(cryptoData).forEach(updateUI);
                    fetchTrendData(selectedSym);
                };
            });
        }
    </script>
</body>
</html>
