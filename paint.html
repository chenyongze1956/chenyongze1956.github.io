
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 关键：禁止用户随意缩放页面，适配移动端视口 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        * {
            box-sizing: border-box;
            /* 禁用移动端长按选中文字、高亮等默认行为，提升游戏体验 */
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        body {
            margin: 0;
            padding: 10px;
    background: linear-gradient(45deg, #ff7e5f, #feb47b, #ffed86, #9feb8f, #5fbfff, #9b8eff);
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .game-container {
            width: 100%;
            max-width: 360px; /* 限制最大宽度，在PC端保持掌机精致感，手机端自动撑满 */
            background: #16213e;
            border: 4px solid #0f3460;
            border-radius: 16px;
            padding: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            text-align: center;
        }
        h2 {
            margin: 5px 0 12px 0;
            font-size: 18px;
            letter-spacing: 2px;
        }
        .screen {
            background: #e0f8cf;
            color: #306230;
            border: 4px solid #8bac0f;
            border-radius: 8px;
            height: 170px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 10px;
            position: relative;
            overflow: hidden;
        }
        .status-bar {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            font-weight: bold;
        }
        .pet-avatar {
            font-size: 55px;
            margin: 5px 0;
            transition: transform 0.2s;
        }
        .pet-message {
            font-size: 12px;
            font-weight: bold;
            min-height: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .stats {
            margin: 12px 0;
            text-align: left;
            font-size: 12px;
        }
        .stat-row {
            display: flex;
            align-items: center;
            margin-bottom: 6px;
        }
        .stat-label {
            width: 45px;
            font-weight: bold;
        }
        .stat-bar-container {
            flex: 1;
            background: #333;
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
            margin-left: 8px;
        }
        .stat-bar {
            height: 100%;
            width: 100%;
            background: #e94560;
            transition: width 0.3s;
        }
        .controls {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-top: 12px;
        }
        button {
            background: #e94560;
            color: white;
            border: none;
            padding: 12px 6px; /* 增大手机端点击热区，防止误触 */
            border-radius: 8px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
            transition: 0.1s;
            touch-action: manipulation; /* 消除移动端点击延迟 */
        }
        button:active {
            transform: scale(0.96);
            background: #c73650;
        }
    </style>
</head>
<body>

<div class="game-container">
    <h2>POKÉ-CHICK</h2>
    
    <div class="screen" id="screen">
        <div class="status-bar">
            <span id="ageText">形态: 未孵化</span>
            <span id="weightText">重: 10g</span>
        </div>
        
        <div class="pet-avatar" id="petAvatar">🥚</div>
        
        <div class="pet-message" id="petMessage">神秘精灵蛋，请选择孵化环境~</div>
    </div>

    <div class="stats" id="statsContainer" style="display:none;">
        <div class="stat-row">
            <span class="stat-label">饱腹</span>
            <div class="stat-bar-container"><div class="stat-bar" id="hungerBar" style="width: 100%;"></div></div>
        </div>
        <div class="stat-row">
            <span class="stat-label">情绪</span>
            <div class="stat-bar-container"><div class="stat-bar" id="happinessBar" style="width: 100%;"></div></div>
        </div>
        <div class="stat-row">
            <span class="stat-label">精力</span>
            <div class="stat-bar-container"><div class="stat-bar" id="energyBar" style="width: 100%;"></div></div>
        </div>
    </div>

    <div class="controls" id="controlPanel">
        <button onclick="hatchAction('warm')">🔥 猛烈加热</button>
        <button onclick="hatchAction('cool')">❄️ 吹风降温</button>
    </div>
</div>

<script>
    let pet = {
        state: 'egg', 
        type: 'normal', 
        hunger: 100,
        happiness: 100,
        energy: 100,
        age: 0,
        weight: 10,
        isSleeping: false,
        hatchPoints: { warmth: 0, coolness: 0, totalClicks: 0 }
    };

    const speciesData = {
        normal: { name: "普通小鸡", avatar: "🐥", color: "#e0f8cf" },
        fire:   { name: "火炎鸡 🔥", avatar: "🐓", color: "#ffcccc" },
        electric:{ name: "雷电鸡 ⚡", avatar: "🦅", color: "#fff0cc" },
        ice:    { name: "冰霜鸡 ❄️", avatar: "🐧", color: "#ccf2ff" },
        god:    { name: "黄金神鸡 👑", avatar: "🐉", color: "#ffe680" }
    };

    const avatarEl = document.getElementById('petAvatar');
    const messageEl = document.getElementById('petMessage');
    const hungerBar = document.getElementById('hungerBar');
    const happinessBar = document.getElementById('happinessBar');
    const energyBar = document.getElementById('energyBar');
    const ageText = document.getElementById('ageText');
    const weightText = document.getElementById('weightText');
    const screenEl = document.getElementById('screen');
    const controlPanel = document.getElementById('controlPanel');
    const statsContainer = document.getElementById('statsContainer');

    function hatchAction(action) {
        pet.hatchPoints.totalClicks += 1;
        if (action === 'warm') {
            pet.hatchPoints.warmth += 2;
            messageEl.innerText = `吸收热量 (${pet.hatchPoints.totalClicks}/6)`;
            avatarEl.innerText = "🔥🥚";
        } else {
            pet.hatchPoints.coolness += 2;
            messageEl.innerText = `适应降温 (${pet.hatchPoints.totalClicks}/6)`;
            avatarEl.innerText = "❄️🥚";
        }

        if (pet.hatchPoints.totalClicks >= 6) {
            determineSpecies();
        }
    }

    function determineSpecies() {
        let w = pet.hatchPoints.warmth;
        let c = pet.hatchPoints.coolness;

        if (Math.abs(w - c) <= 2 && Math.random() < 0.3) {
            pet.type = 'god';
        } else if (w > c + 4) {
            pet.type = 'fire';
        } else if (c > w + 4) {
            pet.type = 'ice';
        } else if (w > c) {
            pet.type = 'electric';
        } else {
            pet.type = 'normal';
        }

        pet.state = 'alive';
        pet.hunger = 100;
        pet.happiness = 100;
        pet.energy = 100;
        pet.age = 0;
        pet.weight = 15;

        let info = speciesData[pet.type];
        avatarEl.innerText = info.avatar;
        messageEl.innerText = `孵化出【${info.name}】！`;
        screenEl.style.background = info.color;

        statsContainer.style.display = "block";
        controlPanel.innerHTML = `
            <button onclick="feed()">喂食 🍚</button>
            <button onclick="play()">玩耍 ⚽</button>
            <button onclick="sleepToggle()" id="sleepBtn">睡觉 💤</button>
            <button onclick="tryLayEgg()" id="layEggBtn" style="display:none; background:#f39c12; grid-column: span 2;">生蛋 🥚</button>
        `;
        updateUI();
    }

    function feed() {
        if (pet.state !== 'alive' || pet.isSleeping) return;
        pet.hunger = Math.min(100, pet.hunger + 25);
        pet.weight += 2;
        messageEl.innerText = "真美味！饱饱的~";
        updateUI();
    }

    function play() {
        if (pet.state !== 'alive' || pet.isSleeping) return;
        if (pet.energy < 15) {
            messageEl.innerText = "太累了，先让它睡会吧";
            return;
        }
        pet.happiness = Math.min(100, pet.happiness + 30);
        pet.energy = Math.max(0, pet.energy - 20);
        messageEl.innerText = "开心地释放了技能！✨";
        updateUI();
    }

    function sleepToggle() {
        if (pet.state !== 'alive') return;
        pet.isSleeping = !pet.isSleeping;
        const sleepBtn = document.getElementById('sleepBtn');
        if (pet.isSleeping) {
            sleepBtn.innerText = "叫醒 ⏰";
            messageEl.innerText = "Zzz... 深度睡眠中...";
            screenEl.style.background = "#1e293b";
            screenEl.style.color = "#94a3b8";
        } else {
            sleepBtn.innerText = "睡觉 💤";
            messageEl.innerText = "精神饱满地醒来啦！";
            screenEl.style.background = speciesData[pet.type].color;
            screenEl.style.color = "#306230";
        }
        updateUI();
    }

    function tryLayEgg() {
        if (pet.age < 3 || pet.hunger < 70) {
            messageEl.innerText = "需成年(>=3天)且饱腹充足！";
            return;
        }

        pet.state = 'egg';
        pet.type = 'normal';
        pet.hatchPoints = { warmth: 0, coolness: 0, totalClicks: 0 };
        pet.age = 0;
        
        messageEl.innerText = "生出了一枚新精灵蛋！";
        avatarEl.innerText = "🥚";
        screenEl.style.background = "#e0f8cf";
        screenEl.style.color = "#306230";
        statsContainer.style.display = "none";
        
        controlPanel.innerHTML = `
            <button onclick="hatchAction('warm')">🔥 猛烈加热</button>
            <button onclick="hatchAction('cool')">❄️ 吹风降温</button>
        `;
    }

    function updateUI() {
        if (pet.state !== 'alive') return;

        hungerBar.style.width = pet.hunger + '%';
        happinessBar.style.width = pet.happiness + '%';
        energyBar.style.width = pet.energy + '%';
        
        ageText.innerText = `${speciesData[pet.type].name.split(' ')[0]} ${pet.age}天`;
        weightText.innerText = `重:${pet.weight}g`;

        const layEggBtn = document.getElementById('layEggBtn');
        if (pet.age >= 3 && layEggBtn) {
            layEggBtn.style.display = "block";
        }
    }

    setInterval(() => {
        if (pet.state !== 'alive') return;

        if (pet.isSleeping) {
            pet.energy = Math.min(100, pet.energy + 15);
            pet.hunger = Math.max(0, pet.hunger - 2);
        } else {
            pet.hunger = Math.max(0, pet.hunger - 3);
            pet.happiness = Math.max(0, pet.happiness - 2);
            pet.energy = Math.max(0, pet.energy - 2);
        }

        if (pet.hunger === 0 && pet.happiness === 0) {
            pet.state = 'dead';
            avatarEl.innerText = "💀";
            messageEl.innerText = "精灵离家出走了...";
            controlPanel.innerHTML = `<button onclick="location.reload()" style="grid-column: span 2;">重新开始 🔄</button>`;
            return;
        }

        updateUI();
    }, 2000);

    setInterval(() => {
        if (pet.state === 'alive') {
            pet.age += 1;
            updateUI();
        }
    }, 15000);
</script>

</body>
</html>
