

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    <style>
        :root {
            /* PS1 官方经典灰色调 */
            --ps-gray: #b7b7b7;
            --ps-dark-gray: #a1a1a1;
            --ps-button-gray: #8e8e8e;
            --ps-power-green: #3cd43c;
        }

        body {
            margin: 0; padding: 0; height: 100vh;
            display: flex; align-items: center; justify-content: center;
background: linear-gradient(45deg,#ff7e5f,#feb47b,#ffed86,#9feb8f,#5fbfff,#9b8eff); 
            font-family: 'ZCOOL KuaiLe', cursive;
            overflow: hidden;
        }

        /* 电视机整体外壳 - 改为 PS1 经典灰 */
        .tv-case {
            position: relative;
            width: 90vw;
            max-width: 820px;
            background: var(--ps-gray);
            padding: 45px 120px 45px 45px;
            border-radius: 40px;
            /* 制造立体机壳感 */
            box-shadow: 
                0 40px 0 #888, /* 底部厚度 */
                0 60px 100px rgba(0,0,0,0.7),
                inset 2px 2px 5px rgba(255,255,255,0.5),
                inset -2px -2px 5px rgba(0,0,0,0.2);
            border: 4px solid #999;
        }

        /* 屏幕区域 */
        .screen-container {
            position: relative;
            background: #000;
            aspect-ratio: 4 / 3;
            border-radius: 15% / 8%;
            border: 25px solid #2a2a2a;
            overflow: hidden;
            box-shadow: inset 0 0 40px #000;
        }

        /* 扫描线效果 */
        .crt-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%);
            background-size: 100% 4px;
            z-index: 5;
            pointer-events: none;
            opacity: 0.5;
        }

        wasmpsx-player {
            display: block; width: 100%; height: 100%;
            filter: contrast(1.1) brightness(1.05) saturate(1.1);
        }

        /* 右侧 PS 风格按钮区 */
        .tv-controls {
            position: absolute;
            right: 35px; top: 50%;
            transform: translateY(-50%);
            display: flex; flex-direction: column; gap: 40px;
            align-items: center;
        }

        /* 模仿 PS1 上的 Reset/Power 按钮 */
        .ps-btn {
            width: 55px; height: 55px;
            background: var(--ps-button-gray);
            border-radius: 50%;
            border: 2px solid #777;
            box-shadow: 0 4px 0 #666;
            cursor: pointer;
            position: relative;
            transition: 0.1s;
        }
        .ps-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #666; }
        
        .ps-btn::before {
            content: ""; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); width: 25px; height: 2px; background: #555;
        }

        /* 绿色指示灯 */
        .power-light {
            width: 12px; height: 12px;
            background: var(--ps-power-green);
            border-radius: 50%;
            box-shadow: 0 0 12px var(--ps-power-green);
            margin-top: -20px;
        }

        /* 底部操作台 */
        .bottom-shelf {
            margin-top: 35px; text-align: center;
        }

        .load-btn {
            background: #ffcc00;
            color: #333;
            padding: 12px 35px;
            border: none;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 0 #b89600;
            transition: 0.1s;
        }
        .load-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #b89600; }

        .brand-text {
            color: #666; font-size: 0.8rem; margin-top: 15px; letter-spacing: 3px;
        }
    </style>
</head>
<body>

<div class="tv-case">
    <div class="screen-container">
        <div class="crt-overlay"></div>
        <wasmpsx-player></wasmpsx-player>
        <canvas id="matrix-canvas" style="position:absolute; top:0; left:0; width:100%; height:100%; z-index:15; display:none;"></canvas>
    </div>

    <div class="tv-controls">
        <div class="ps-btn" title="Reset"></div>
        <div class="ps-btn" title="Power" onclick="document.querySelector('.power-light').style.opacity = (document.querySelector('.power-light').style.opacity == '0.2' ? '1' : '0.2')"></div>
        <div class="power-light"></div>
    </div>
</div>

<div class="bottom-shelf" style="position: absolute; bottom: 40px; width: 100%;">
    <button class="load-btn" onclick="document.getElementById('file-input').click()">💿 放入 PS 游戏光盘</button>
   <input id="file-input" style="display: none;" type="file" onchange="handleFile(this.files[0])" />
    <div class="brand-text">P-S-1 EMULATOR CONSOLE</div>
</div>

<script src="wasmpsx.min.js"></script>
<script>
    setTimeout(function(){
        const player = document.querySelector('wasmpsx-player');
        if (player && player.shadowRoot) {
            const canvas = player.shadowRoot.querySelector('canvas');
            if (canvas) {
                canvas.style.width = "100%";
                canvas.style.height = "100%";
                canvas.style.objectFit = "cover";
                canvas.style.filter = "blur(0.2px) contrast(1.1)";
            }
        }
    }, 200);


function startMatrixRain() {
    const canvas = document.getElementById('matrix-canvas');
    canvas.style.display = 'block';
    const ctx = canvas.getContext('2d');
    canvas.width = canvas.offsetWidth;
    canvas.height = canvas.offsetHeight;
    
    const chars = "01010101HAXOR";
    const fontSize = 10;
    const columns = canvas.width / fontSize;
    const drops = Array(Math.floor(columns)).fill(1);

    const interval = setInterval(() => {
        ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#0F0";
        ctx.font = fontSize + "px monospace";

        for (let i = 0; i < drops.length; i++) {
            const text = chars[Math.floor(Math.random() * chars.length)];
            ctx.fillText(text, i * fontSize, drops[i] * fontSize);
            if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
            drops[i]++;
        }
    }, 50);

    return interval; // 返回句柄以便停止
}

  async function handleFile(file) {
    if (!file) return;

    const bootScreen = document.getElementById('boot-screen');
    const matrixCanvas = document.getElementById('matrix-canvas');
    const player = document.querySelector('wasmpsx-player');

    // 显示破解界面
    if (bootScreen) {
        bootScreen.style.display = 'flex';
        bootScreen.style.opacity = '1';
        bootScreen.innerHTML = `<div>正在注入 ISO 解码器...</div>`;
    }

    const matrixInterval = startMatrixRain(); 
    
    try {
        // --- 这里修改时间，单位是毫秒 (例如 8000 就是 8 秒) ---
        const hackingDuration = 8000; 
        
        await new Promise(r => setTimeout(r, hackingDuration));
        
        // 游戏加载逻辑
        if (player && typeof player.readFile === 'function') {
            await player.readFile(file);
        }
    } catch (err) {
        console.error("加载失败:", err);
    } finally {
        // 停止代码雨并清理
        if (matrixInterval) clearInterval(matrixInterval);
        if (matrixCanvas) matrixCanvas.style.display = 'none';
        
        if (bootScreen) {
            bootScreen.innerHTML = "<div>破解成功，正在启动...</div>";
            setTimeout(() => {
                bootScreen.style.opacity = '0';
                setTimeout(() => { bootScreen.style.display = 'none'; }, 1000);
            }, 1000);
        }
    }
}
    console.log("DOM 检查:", document.getElementById('boot-screen'), document.getElementById('matrix-canvas'));
</script>

</body>
</html>
