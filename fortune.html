        function drawStarMap(seedText) {
            const svg = document.getElementById('constellation-svg');
            svg.innerHTML = '';
            const points = [];
            const count = 5 + (seedText.length % 3); // 随机生成5-7个点
            
            // 简单的伪随机坐标生成
            for (let i = 0; i < count; i++) {
                points.push({
                    x: 40 + Math.abs(Math.sin(seedText.charCodeAt(0) + i) * 120),
                    y: 20 + Math.abs(Math.cos(seedText.charCodeAt(0) * i) * 80)
                });
            }

            // 画连线
            let pathData = `M ${points[0].x} ${points[0].y}`;
            for (let i = 1; i < points.length; i++) {
                pathData += ` L ${points[i].x} ${points[i].y}`;
                const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                line.setAttribute("x1", points[i-1].x); line.setAttribute("y1", points[i-1].y);
                line.setAttribute("x2", points[i].x); line.setAttribute("y2", points[i].y);
                line.setAttribute("class", "star-line");
                svg.appendChild(line);
            }

            // 画星点
            points.forEach(p => {
                const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                circle.setAttribute("cx", p.x); circle.setAttribute("cy", p.y);
                circle.setAttribute("r", "2.5"); circle.setAttribute("class", "star-dot");
                svg.appendChild(circle);
            });
        }

            new QRCode(document.getElementById("qrcode"), {
                text: window.location.href, width: 60, height: 60,
                colorDark : "#3e2723", colorLight : "#e8dcc4"
            });

        } catch (e) {
            document.getElementById('content-area').innerHTML = "推演失败，请检查 calendar.js。";
        }

        document.getElementById('save-btn').addEventListener('click', function() {
            html2canvas(document.getElementById('result'), { scale: 3, useCORS: true }).then(canvas => {
                const link = document.createElement('a');
                link.download = `演禽命书_${y}${m}${d}.png`;
                link.href = canvas.toDataURL();
                link.click();
            });
        });
    </script>
</body>
</html>
