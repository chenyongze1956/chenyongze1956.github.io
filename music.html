<script src="https://unpkg.com/live2d-widget@3.1.4/lib/L2Dwidget.min.js"></script><script>    const phone = document.getElementById('nokiaPhone');    const iframe = document.getElementById('nokiaIframe');    const canvas = document.getElementById('snakeCanvas');    const terminal = document.getElementById('psTerminal');    const video = document.getElementById('webcam');    const ctx = canvas.getContext('2d');        let isPowered = false, currentMode = 'web', videoStream = null;    let gLoop, musicInterval, cryptoInterval, nyanInterval, matrixInterval, slInterval;    // 播放列表
const musicList = [
    { title: "歌曲1", url: "https://www.joy127.com/url/148587.mp3" },
    { title: "歌曲2", url: "https://www.joy127.com/url/152038.mp3" }, // 换成你想听的音乐链接
    { title: "歌曲3", url: "https://www.joy127.com/url/152030.mp3" }
];
let currentTrackIndex = 0;
let audio = new Audio(musicList[currentTrackIndex].url);   let isPlaying = false;
    function playVibration() { if (navigator.vibrate) navigator.vibrate(50); }
   function powerOn() {
    playVibration();
    if(!isPowered) {
        const fruits = ["🍎", "🍍", "🍓", "🍒", "🍇", "🍑", "🍋"];
        const randomFruit = fruits[Math.floor(Math.random() * fruits.length)];
        
        // 1. 设置背景显示
        document.getElementById('boot-bg').style.display = 'block';
        
        // 2. 显示图标
        const iconEl = document.getElementById('bootIcon');
        iconEl.innerText = randomFruit;
        iconEl.style.fontSize = "40px";
        iconEl.style.zIndex = "11"; // 确保在图片之上
        
        phone.classList.add('booting');
        
        setTimeout(() => {
            phone.classList.remove('booting');
            // 3. 彻底开机后隐藏开机画面
            document.getElementById('boot-bg').style.display = 'none';
            phone.classList.add('powered-on');
            isPowered = true;
            showCatSpeech("水果手机启动成功喵！");
        },8000);
    } else {
        phone.classList.remove('powered-on');
        isPowered = false;
        stopAll();
    }
} 
    function stopAll() {
    clearInterval(gLoop); clearInterval(musicInterval); clearInterval(cryptoInterval);
    clearInterval(nyanInterval); clearInterval(matrixInterval); clearInterval(slInterval);
    audio.pause(); audio.currentTime = 0; isPlaying = false;
    if(videoStream) { videoStream.getTracks().forEach(t=>t.stop()); videoStream = null; }
    
    // --- 新增：强制隐藏梦境框 ---
    document.getElementById('dreamBox').style.display = 'none';

    document.getElementById('blogPanel').style.display = 'none';
    
    document.getElementById('sFrame').classList.remove('pixel-cam-active');
    document.getElementById('twitchBox').style.display = 'none';
    document.getElementById('twitchBox').innerHTML = '';
    const cp = document.getElementById('cryptoPanel'); if(cp) cp.style.display = 'none';
    const ab = document.getElementById('animeBox'); if(ab) ab.style.display = 'none';
    
    // 确保 iframe, canvas, terminal 移除 active
    [iframe, canvas, terminal].forEach(el => el.classList.remove('active'));
}

    // --- Twitch 功能 ---
    function toggleTwitch() {
        if(!isPowered) return;
        playVibration();
        const channel = prompt("请输入 Twitch 频道名 (例如: shroud):", "shroud");
        if(!channel) return;
        
        stopAll();
        currentMode = 'twitch';
        const box = document.getElementById('twitchBox');
        box.style.display = 'block';
        // 使用 Twitch 嵌入式播放器，parent 需要设置为你的当前域名或 localhost
        box.innerHTML = `<iframe src="https://player.twitch.tv/?channel=${channel}&parent=${window.location.hostname || 'localhost'}&muted=false" height="100%" width="100%" allowfullscreen></iframe>`;
        showCatSpeech(`正在为您转播 ${channel} 的直播喵！`);
    }

    // --- 终端逻辑 ---
    const commands = {        'help': 'ls: 查看文件\nsl: 蒸汽机车\nfortune: 算命\nnyancat: 启动彩虹猫\ncmatrix: 代码雨\nwhoami: 用户名\nclear: 清屏\nexit: 退出',        'ls': 'Mode  Name\n----  ----\n-a--  sl.sh\n-a--  fortune.sh\n-a--  nyancat.sh\n-a--  cmatrix.sh',        'whoami': 'root_cat_hijiki',        'fortune': () => {            const f = ["大吉：今日宜摸鱼，Bug不侵！", "中吉：会有好事发生喵！", "小吉：宜吃小鱼干。", "大凶：代码写错位了，快检查！"];            return f[Math.floor(Math.random()*f.length)];        }    };

    function toggleTerminal() {        if(!isPowered) return;        playVibration(); stopAll();        currentMode = 'term';        terminal.classList.add('active');        handleTerminalInput();    }

    function handleTerminalInput() {        if(currentMode !== 'term') return;        const cmd = prompt("PowerShell (输入 help 查看命令):");        if (!cmd) return;        const log = document.getElementById('psLog');        const cleanCmd = cmd.toLowerCase().trim();        log.innerHTML += `\nPS C:\\Hijiki> ${cmd}`;                if (cleanCmd === 'sl') {            startSL();        } else if (cleanCmd === 'fortune') {            const res = commands.fortune();            log.innerHTML += `\n${res}`;            showCatSpeech(res);            terminal.scrollTop = terminal.scrollHeight;            setTimeout(handleTerminalInput, 800);        } else if (cleanCmd === 'nyancat') {            startNyanCat();        } else if (cleanCmd === 'cmatrix') {            startCMatrix();        } else if (cleanCmd === 'clear') {            log.innerHTML = "";            setTimeout(handleTerminalInput, 100);        } else if (commands[cleanCmd]) {            log.innerHTML += `\n${commands[cleanCmd]}`;            terminal.scrollTop = terminal.scrollHeight;            setTimeout(handleTerminalInput, 500);        } else if (cleanCmd === 'exit') {            resetMode();        } else {            log.innerHTML += `\n'${cmd}' 未识别命令。`;            terminal.scrollTop = terminal.scrollHeight;            setTimeout(handleTerminalInput, 500);        }    }

    function startSL() {        stopAll();        currentMode = 'sl';        canvas.classList.add('active');        showCatSpeech("呜呜呜！火车来啦！");        let x = 150;        const train = ["      ====  ____","  _D__G|_||_||______|_____"," |________________________|","   O O O O      O O O O"];        slInterval = setInterval(() => {            ctx.fillStyle = "#9ead86"; ctx.fillRect(0, 0, 150, 110);            ctx.fillStyle = "#222b16";            ctx.font = "8px monospace";            train.forEach((line, i) => { ctx.fillText(line, x, 50 + (i * 10)); });            x -= 4;            if (x < -150) { clearInterval(slInterval); toggleTerminal(); }        }, 50);    }

    function startCMatrix() {        stopAll(); currentMode = 'matrix'; canvas.classList.add('active');        const fontSize = 10; const columns = Math.floor(150 / fontSize);        const drops = Array(columns).fill(1);        matrixInterval = setInterval(() => {            ctx.fillStyle = "rgba(0, 0, 0, 0.1)"; ctx.fillRect(0, 0, 150, 110);            ctx.fillStyle = "#0F0"; ctx.font = fontSize + "px monospace";            for (let i = 0; i < drops.length; i++) {                const text = String.fromCharCode(0x30A0 + Math.random() * 96);                ctx.fillText(text, i * fontSize, drops[i] * fontSize);                if (drops[i] * fontSize > 110 && Math.random() > 0.975) drops[i] = 0;                drops[i]++;            }        }, 50);    }

    function startNyanCat() {        stopAll(); currentMode = 'nyan'; canvas.classList.add('active');        let frame = 0; const colors = ['#f00','#f90','#ff0','#3f0','#09f','#63f'];        nyanInterval = setInterval(() => {            ctx.fillStyle = "#014482"; ctx.fillRect(0, 0, 150, 110);            const wave = Math.sin(frame * 0.5) * 5;            colors.forEach((c, i) => { ctx.fillStyle = c; ctx.fillRect(0, 40+wave+(i*4), 80, 4); });            ctx.fillStyle = "#ffcc99"; ctx.fillRect(80, 42+wave, 25, 18);            frame += 5; if(frame > 300) frame = 0;        }, 100);    }

    async function toggleCamera() {        if(!isPowered) return; playVibration(); stopAll(); currentMode = 'camera';        canvas.classList.add('active'); document.getElementById('sFrame').classList.add('pixel-cam-active');        try {            videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });            video.srcObject = videoStream; video.onloadedmetadata = () => { video.play(); drawPixel(); };        } catch (e) { alert("无摄像头权限"); resetMode(); }    }

    function drawPixel() {        if (currentMode !== 'camera') return;        ctx.drawImage(video, 0, 0, 150, 110);        const data = ctx.getImageData(0, 0, 150, 110).data;        ctx.fillStyle = "#9ead86"; ctx.fillRect(0,0,150,110);        for(let y=0; y<110; y+=4) {            for(let x=0; x<150; x+=4) {                const i = (y*150 + x)*4;                const avg = (data[i]+data[i+1]+data[i+2])/3;                ctx.fillStyle = avg < 128 ? "#222b16" : "#8ca075";                ctx.fillRect(x,y,3,3);            }        }        requestAnimationFrame(drawPixel);    }

    function snakeMove(d) { dir = d; playVibration(); }

    function resetMode() {        if(!isPowered) return; playVibration();        if (['camera','nyan','matrix','sl','twitch'].includes(currentMode)) {             stopAll(); currentMode = 'web'; iframe.classList.add('active');         } else { toggleCamera(); }    }

    function openUrl() {        if(!isPowered) return;        const u = prompt("输入网址", "https://");        if(u) { stopAll(); iframe.src = u; iframe.classList.add('active'); currentMode = 'web';}    }

    function toggleMusic() {
    if (!isPowered) return;
    playVibration();
    
    // 如果已经在播放，点击则“切歌”而不是停止
    if (isPlaying) {
        currentTrackIndex = (currentTrackIndex + 1) % musicList.length;
        audio.src = musicList[currentTrackIndex].url;
        audio.play();
        showCatSpeech(`正在切换到: ${musicList[currentTrackIndex].title} 喵~`);
    } else {
        // 如果未播放，则开始播放
        stopAll();
        currentMode = 'music';
        canvas.classList.add('active');
        
        audio.src = musicList[currentTrackIndex].url;
        audio.play();
        isPlaying = true;
        
        musicInterval = setInterval(() => {
            ctx.fillStyle = "#9ead86";
            ctx.fillRect(0, 0, 150, 110);
            ctx.fillStyle = "#222b16";
            for (let i = 0; i < 15; i++) {
                const h = Math.random() * 80;
                ctx.fillRect(i * 10 + 2, 90 - h, 6, h);
            }
        }, 100);
        showCatSpeech(`播放: ${musicList[currentTrackIndex].title} 喵~`);
    }
}
    function stopMusic() {
    audio.pause();
    isPlaying = false;
    clearInterval(musicInterval);
    // 隐藏可视化界面
    canvas.classList.remove('active');
}

    let skinIndex = 0;
    function changePhoneSkin() {        if(!isPowered) return;        playVibration();        const phoneSkins = [            { bg: '#d1d5db', border: '#a1a5af' }, { bg: '#222', border: '#444' },            { bg: '#e94560', border: '#a01a30' }, { bg: '#0f3460', border: '#0a213d' },            { bg: '#9ead86', border: '#222b16' }        ];        skinIndex = (skinIndex + 1) % phoneSkins.length;        phone.style.background = phoneSkins[skinIndex].bg;        phone.style.borderColor = phoneSkins[skinIndex].border;        showCatSpeech("新衣服好看喵？");    }

    function toggleCrypto() {        if (!isPowered) return; playVibration(); stopAll(); currentMode = 'crypto';        let panel = document.getElementById('cryptoPanel') || (() => {            let p = document.createElement('div'); p.id = 'cryptoPanel';            document.querySelector('.lcd').appendChild(p); return p;        })();        panel.style.display = 'flex';        const fetchC = async () => {            try {                const r = await fetch('https://api.binance.com/api/v3/ticker/24hr?symbols=["BTCUSDT","ETHUSDT"]');                const data = await r.json();                panel.innerHTML = '<div style="border-bottom:1px solid">CRYPTO</div>';                data.forEach(c => { panel.innerHTML += `<div class="crypto-item"><span>${c.symbol}</span><span>$${parseFloat(c.lastPrice).toFixed(1)}</span></div>`; });            } catch(e) { panel.innerHTML = "网络错误"; }        };        fetchC(); cryptoInterval = setInterval(fetchC, 10000);    }

    function toggleAnime() {        if (!isPowered) return; playVibration(); stopAll(); currentMode = 'anime';        let box = document.getElementById('animeBox') || (() => {            let b = document.createElement('div'); b.id = 'animeBox';            b.innerHTML = `<iframe width="100%" height="100%" src="https://www.youtube.com/embed/24Yuzq3DQk0" frameborder="0" allow="autoplay"></iframe>`;            document.querySelector('.lcd').appendChild(b); return b;        })();        box.style.display = 'block';    }

    async function askAI(t) {        const box = document.getElementById('msgBox'); box.innerHTML += `<div><b>我:</b> ${t}</div>`;        try {            const r = await fetch('https://api.deepseek.com/chat/completions', {                method: 'POST',                headers: {'Content-Type': 'application/json', 'Authorization': `Bearer sk-29e9cc216a944dd2a5f518ace2d4d65a`},                body: JSON.stringify({model: "deepseek-chat", messages: [{role:"system", content:"你是Hijiki猫喵。"}, {role:"user", content:t}]})            });            const d = await r.json(); const reply = d.choices[0].message.content;            box.innerHTML += `<div style="color:red;"><b>猫:</b> ${reply}</div>`;            box.scrollTop = box.scrollHeight; showCatSpeech(reply);        } catch(e) { showCatSpeech("断网了喵..."); }    }
    function sendQQMsg() { const i = document.getElementById('qq-input'); if(i.value) { askAI(i.value); i.value=''; } }
    function toggleQQ() { playVibration(); document.getElementById('qqPanel').classList.toggle('active'); }
    function showCatSpeech(t) {        const d = document.querySelector('.live2d-widget-dialog'); if(d) d.innerText = t;        if(window.speechSynthesis) window.speechSynthesis.speak(new SpeechSynthesisUtterance(t));    }

    L2Dwidget.init({ "model": { "jsonPath": "https://unpkg.com/live2d-widget-model-shizuku@1.0.5/assets/shizuku.model.json" }, "display": { "position": "right", "width": 100, "height": 200 }, "dialog": { "enable": true } });


let resetClicks = 0;
let resetTimer = null;
let isExploded = false;

function softReset() {
    // 检查：如果已经炸了，或者未开机，直接退出
    if (!isPowered || isExploded) return;
    
    resetClicks++;
    clearTimeout(resetTimer);
    resetTimer = setTimeout(() => { resetClicks = 0; }, 2000); 

    if (resetClicks >= 3) {
        // --- 爆炸逻辑 ---
        isExploded = true;
        const phone = document.getElementById('nokiaPhone');
        const lcd = document.querySelector('.lcd');
        
        // 触发震动
        phone.classList.add('explosion-shake');
        showCatSpeech("警告！内存过载！要炸了喵！！");
        
        // 延迟触发爆炸效果
        setTimeout(() => {
            phone.classList.remove('explosion-shake');
            phone.classList.add('exploded');
            lcd.classList.add('lcd-burn');
            lcd.style.background = "#000";
            
            stopAll();
            showCatSpeech("BOOM!! 手机坏掉了...喵...");
        }, 800);
        
        // 6秒后冷却并恢复
        setTimeout(() => {
            phone.classList.remove('exploded');
            lcd.classList.remove('lcd-burn');
            lcd.style.background = "";
            isExploded = false;
            resetClicks = 0;
            showCatSpeech("修好了喵...下次别再玩坏我了！");
        }, 6000);
        
    } else {
        // --- 正常重置逻辑 ---
        playVibration();
        stopAll();
        currentMode = 'web';
        iframe.src = 'about:blank';
        iframe.classList.add('active');
        showCatSpeech("清理内存中...喵~");
    }
}



function toggleDream() {

    stopAll();
    currentMode = 'dream';
    
    const dreamBox = document.getElementById('dreamBox');
    const dreamContent = document.getElementById('dreamContent');
    const dreamVisual = document.getElementById('dreamVisual');
    dreamBox.style.display = 'flex';
    
    const theme = prompt("你想让猫咪梦见什么？", "星空");
    if (!theme) return resetMode();
    
    dreamContent.innerText = `猫咪正在梦见: "${theme}"...`;
    dreamVisual.innerHTML = ''; // 清空之前梦境
    
   // 在 toggleDream 函数中修改像素点坐标逻辑
for (let i = 0; i < 50; i++) {
    let pixel = document.createElement('div');
    pixel.className = 'dream-pixel';

    askAI(`用猫咪的语气，描述一下梦见“${theme}”的感觉，要短且充满幻觉感。`);
}
