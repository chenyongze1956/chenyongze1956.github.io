
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <style>
        /* 全局重置与神秘基调 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', 'KaiTi', serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0c0b14;
            overflow: hidden;
        }

        /* 彩虹动态渐变背景 */
        .cosmic-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, #ff7e5f, #feb47b, #ffed86, #9feb8f, #5fbfff, #9b8eff);
            background-size: 400% 400%;
            animation: rainbowFlow 12s ease infinite;
            z-index: 0;
        }

        @keyframes rainbowFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 柔光粒子层 */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
                
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            animation: float 6s ease-in-out infinite alternate;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.3);

            
        }

        @keyframes float {
            0% {
                opacity: 0.2;
                transform: translateY(0) scale(0.8);
            }
            100% {
                opacity: 0.9;
                transform: translateY(-40px) scale(1.2);
            }
        }

        /* 主容器 — 灵枢星门（半透磨砂） */
        .portal-container {
            position: relative;
            z-index: 10;
            width: 96%;
            max-width: 720px;
            padding: 28px 22px 34px;
            
           
        
        }

        /* 符文装饰 */
        .rune-line {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 16px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.75rem;
            letter-spacing: 8px;
            opacity: 0.8;
            font-family: 'Georgia', serif;
            text-shadow: 0 0 12px rgba(255, 200, 100, 0.3);
        }

        /* 标题 — 灵枢 */
        .title-occult {
            text-align: center;
            font-size: 2.6rem;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 0 30px rgba(255, 200, 100, 0.4), 0 0 60px rgba(255, 150, 50, 0.2);
            letter-spacing: 12px;
            margin-bottom: 6px;
            font-family: 'Georgia', 'KaiTi', serif;
        }

        .title-occult small {
            display: block;
            font-size: 0.75rem;
            letter-spacing: 6px;
            opacity: 0.7;
            font-weight: 300;
            margin-top: -4px;
            color: #fff8e7;
            text-shadow: 0 0 20px rgba(255, 200, 100, 0.2);
        }

        /* 星门守护者卡片 */
        .guardians {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 28px;
            margin: 28px 0 32px;
        }

        .guardian-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            padding: 14px 12px 12px;
            border-radius: 40px 12px 40px 12px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            min-width: 110px;
            backdrop-filter: blur(4px);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
        }

        .guardian-card:hover {
            transform: translateY(-6px) scale(1.02);
            border-color: rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 12px 32px rgba(255, 200, 100, 0.2);
        }

        .guardian-card.active {
            border-color: #ffffff;
            box-shadow: 0 0 40px rgba(255, 200, 100, 0.25), 0 0 80px rgba(255, 200, 100, 0.08);
            background: rgba(255, 255, 255, 0.15);
        }

        .avatar-occult {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.3);
            overflow: hidden;
            margin-bottom: 8px;
            box-shadow: 0 0 30px rgba(255, 200, 100, 0.15);
            transition: all 0.4s;
            position: relative;
        }

        .avatar-occult img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .guardian-card.active .avatar-occult {
            border-color: #ffffff;
            box-shadow: 0 0 40px rgba(255, 200, 100, 0.3);
        }

        .guardian-name {
            color: #ffffff;
            font-size: 1rem;
            font-weight: 400;
            letter-spacing: 2px;
            font-family: 'Georgia', serif;
            text-shadow: 0 0 20px rgba(255, 200, 100, 0.2);
        }

        .guardian-title {
            font-size: 0.6rem;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 4px;
            margin-top: 2px;
        }

        /* 悬停全息投影 */
        .hologram {
            display: none;
            position: absolute;
            bottom: calc(100% + 12px);
            left: 50%;
            transform: translateX(-50%);
            width: 160px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(8px);
            padding: 8px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
            pointer-events: none;
        }

        .hologram img {
            width: 100%;
            border-radius: 8px;
            display: block;
        }

        .guardian-card:hover .hologram {
            display: block;
        }

        /* 登录仪式按钮 */
        .ritual-bar {
            display: flex;
            justify-content: center;
            gap: 18px;
            flex-wrap: wrap;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-occult {
            padding: 12px 32px;
            border-radius: 60px 12px 60px 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            font-size: 1rem;
            font-weight: 300;
            letter-spacing: 3px;
            cursor: pointer;
            transition: all 0.3s;
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: 'Georgia', serif;
            text-shadow: 0 0 20px rgba(255, 200, 100, 0.1);
        }

        .btn-occult:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 0 40px rgba(255, 200, 100, 0.15);
            transform: scale(1.02);
        }

        .btn-occult:active {
            transform: scale(0.95);
        }

        /* 秘语弹窗 */
        .oracle-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(6px);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .oracle-dialog {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 48px 16px 48px 16px;
            padding: 32px 30px;
            max-width: 400px;
            width: 92%;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(20px);
            text-align: center;
        }

        .oracle-dialog h3 {
            color: #ffffff;
            font-size: 1.5rem;
            font-weight: 300;
            letter-spacing: 6px;
            margin-bottom: 16px;
            text-shadow: 0 0 30px rgba(255, 200, 100, 0.2);
        }

        .oracle-dialog .fa {
            color: #ffed86;
            font-size: 2rem;
            margin-bottom: 8px;
            text-shadow: 0 0 30px rgba(255, 200, 100, 0.3);
        }

        .oracle-dialog p {
            color: rgba(255, 255, 255, 0.7);
        }

        .oracle-dialog input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 40px 8px 40px 8px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(0, 0, 0, 0.2);
            color: #ffffff;
            font-size: 1rem;
            margin: 16px 0 20px;
            outline: none;
            font-family: 'Georgia', serif;
            letter-spacing: 2px;
        }

        .oracle-dialog input:focus {
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 0 30px rgba(255, 200, 100, 0.1);
        }

        .oracle-actions {
            display: flex;
            gap: 14px;
            justify-content: center;
        }

        .oracle-actions .btn-occult {
            padding: 10px 24px;
            font-size: 0.9rem;
        }

        /* 星门跃迁加载 */
        .jumpgate {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 200;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(8px);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .jumpgate .spiral {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-top-color: #ffed86;
            animation: spin 1.2s cubic-bezier(0.6, 0, 0.4, 1) infinite;
            box-shadow: 0 0 60px rgba(255, 200, 100, 0.1);
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .jumpgate .gate-text {
            margin-top: 28px;
            color: #ffffff;
            font-size: 1.1rem;
            letter-spacing: 6px;
            font-family: 'Georgia', serif;
            animation: pulseText 1.8s ease-in-out infinite;
            text-shadow: 0 0 30px rgba(255, 200, 100, 0.2);
        }

        @keyframes pulseText {
            0%,
            100% {
                opacity: 0.5;
            }
            50% {
                opacity: 1;
            }
        }

        .jumpgate .gate-progress {
            width: 200px;
            height: 3px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 4px;
            margin-top: 16px;
            overflow: hidden;
        }

        .jumpgate .gate-progress .bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff7e5f, #ffed86, #5fbfff, #9b8eff);
            border-radius: 4px;
            transition: width 0.25s;
        }

        /* 响应式 */
        @media (max-width: 600px) {
            .portal-container {
                padding: 20px 16px 26px;
                border-radius: 40px 12px 40px 12px;
            }
            .title-occult {
                font-size: 2rem;
                letter-spacing: 8px;
            }
            .guardians {
                gap: 16px;
            }
            .guardian-card {
                min-width: 80px;
                padding: 10px 8px;
            }
            .avatar-occult {
                width: 68px;
                height: 68px;
            }
            .btn-occult {
                padding: 10px 20px;
                font-size: 0.85rem;
            }
            .oracle-dialog {
                padding: 24px 18px;
            }
        }

        @media (max-width: 420px) {
            .guardian-card {
                min-width: 70px;
            }
            .avatar-occult {
                width: 56px;
                height: 56px;
            }
            .guardian-name {
                font-size: 0.8rem;
            }
            .title-occult {
                font-size: 1.6rem;
            }
            .ritual-bar {
                gap: 10px;
            }
            .btn-occult {
                font-size: 0.75rem;
                padding: 8px 16px;
            }
        }


        
    </style>
</head>
<body>

    <!-- 彩虹动态背景 -->
    <div class="cosmic-bg"></div>

    <!-- 粒子层 (JS生成) -->
    <div class="particles" id="particles"></div>

    <!-- ===== 星门主界面 ===== -->
    <div class="portal-container" id="portal">
        <div class="rune-line"></div>
        <div class="title-occult">
            
            <small></small>
        </div>

        <!-- 守护者 -->
        <div class="guardians" id="guardians">
            <div class="guardian-card active" data-username="Administrator" data-pass="">
                <div class="avatar-occult">
                    <img src="https://i.ibb.co/R4vzqcYb/image.jpg" alt="Administrator">
                </div>
                <div class="guardian-name"></div>
                <div class="guardian-title">Administrator</div>
                <!-- 全息投影 -->
                <div class="hologram">
                    <img src="https://od.lk/s/NDBfMTM5Mjk2ODMyXw/Hello%20Kitty%20Pink%20GIF.gif" alt="hologram">
                </div>
            </div>

            <div class="guardian-card" data-username="User" data-pass="">
                <div class="avatar-occult">
                    <img src="https://od.lk/s/NDBfMTMyMDgzNDAzX3pKdU9j/2YSBqg8jt6ggv6z.thumb.300_0.jpeg" alt="User">
                </div>
                <div class="guardian-name">✦  ✦</div>
                <div class="guardian-title">User</div>
                <div class="hologram">
                    <img src="https://od.lk/s/NDBfMTM5Mjk2ODMyXw/Hello%20Kitty%20Pink%20GIF.gif" alt="hologram">
                </div>
            </div>
        </div>

        <!-- 仪式按钮 -->
        <div class="ritual-bar">
            <div class="btn-occult" id="btnUnlock">
                <i class="fa fa-key"></i> 开启尘封之门
            </div>
        </div>
    </div>

    <!-- ===== 秘语弹窗 ===== -->
    <div class="oracle-overlay" id="oracleOverlay">
        <div class="oracle-dialog">
            <i class="fa fa-moon-o"></i>
            <h3>✦ 秘语验证 ✦</h3>
            <p style="color:rgba(255,255,255,0.7); font-size:0.85rem; letter-spacing:2px; margin-bottom:4px;">请输入第七密语</p>
            <input type="password" id="oraclePass" placeholder="· · · · · · · ·">
            <div class="oracle-actions">
                <div class="btn-occult" id="btnCancelOracle" style="padding:8px 18px;">
                    <i class="fa fa-times"></i> 消散
                </div>
                <div class="btn-occult" id="btnConfirmOracle" style="padding:8px 18px;">
                    <i class="fa fa-check"></i> 启封
                </div>
            </div>
        </div>
    </div>

    <!-- ===== 星门跃迁加载 ===== -->
    <div class="jumpgate" id="jumpgate">
        <div class="spiral"></div>
        <div class="gate-text" id="gateText">✦ 正在穿越尘封之门 ✦</div>
        <div class="gate-progress">
            <div class="bar" id="gateBar"></div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // ---- 粒子生成 ----
            const particlesContainer = document.getElementById('particles');
            for (let i = 0; i < 40; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + '%';
                p.style.top = Math.random() * 100 + '%';
                p.style.width = (2 + Math.random() * 4) + 'px';
                p.style.height = p.style.width;
                p.style.animationDelay = (Math.random() * 6) + 's';
                p.style.animationDuration = (4 + Math.random() * 5) + 's';
                p.style.opacity = 0.3 + Math.random() * 0.5;
                particlesContainer.appendChild(p);
            }

            // ---- DOM 引用 ----
            const guardianCards = document.querySelectorAll('.guardian-card');
            const btnUnlock = document.getElementById('btnUnlock');
            const oracleOverlay = document.getElementById('oracleOverlay');
            const btnCancelOracle = document.getElementById('btnCancelOracle');
            const btnConfirmOracle = document.getElementById('btnConfirmOracle');
            const oraclePass = document.getElementById('oraclePass');
            const jumpgate = document.getElementById('jumpgate');
            const gateBar = document.getElementById('gateBar');
            const gateText = document.getElementById('gateText');

            let selectedUser = 'Administrator';
            let selectedPass = '';

            // ---- 守护者选择 ----
            guardianCards.forEach(card => {
                card.addEventListener('click', function(e) {
                    guardianCards.forEach(c => c.classList.remove('active'));
                    this.classList.add('active');
                    selectedUser = this.dataset.username;
                    selectedPass = this.dataset.pass || '';
                });
            });

            // ---- 开启星门（显示秘语弹窗） ----
            btnUnlock.addEventListener('click', function() {
                oracleOverlay.style.display = 'flex';
                oraclePass.value = '';
                oraclePass.focus();
            });

            // ---- 取消 ----
            btnCancelOracle.addEventListener('click', function() {
                oracleOverlay.style.display = 'none';
            });

            // 点击背景关闭
            oracleOverlay.addEventListener('click', function(e) {
                if (e.target === this) {
                    this.style.display = 'none';
                }
            });

            // ---- 确认秘语 ----
            btnConfirmOracle.addEventListener('click', function() {
                const inputPass = oraclePass.value.trim();
                oracleOverlay.style.display = 'none';

                // 启动跃迁
                jumpgate.style.display = 'flex';
                gateBar.style.width = '0%';
                const messages = [
                    '✦ 解析灵识签名 ✦',
                    '✦ 校准尘封之门坐标 ✦',
                    '✦ 构筑量子通道 ✦',
                    '✦ 尘封之门已开启 ✦'
                ];

                let progress = 0;
                let msgIndex = 0;
                const interval = setInterval(() => {
                    progress += 2 + Math.random() * 4;
                    if (progress > 100) progress = 100;
                    gateBar.style.width = progress + '%';

                    const idx = Math.min(Math.floor(progress / 25), messages.length - 1);
                    if (idx !== msgIndex) {
                        msgIndex = idx;
                        gateText.textContent = messages[msgIndex];
                    }

                    if (progress >= 100) {
                        clearInterval(interval);
                        setTimeout(() => {
                            // 跳转逻辑：Administrator 且密码为空
                            if (selectedUser === 'Administrator' && inputPass === '') {
                                window.location.href = 'https://chenyongze1956.github.io/Boogle.html';
                            } else {
                                alert('✦ 灵识对接完成 ✦\n欢迎回来，' + selectedUser + '。');
                                jumpgate.style.display = 'none';
                                gateText.textContent = '✦ 正在穿越尘封之门 ✦';
                            }
                        }, 800);
                    }
                }, 90);
            });

            // ---- 键盘回车 ----
            oraclePass.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    btnConfirmOracle.click();
                }
            });

            // ---- 选中用户默认高亮 ----
            // 已默认第一个 active
        });
    </script>
</body>
</html>
