
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AI 古籍观相 - 移动端优化版</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/live2d-widget@3.1.4/lib/L2Dwidget.min.js"></script>
    <style>
        :root { --neon: #22d3ee; --bg: #0f172a; --gold: #fbbf24; }
        
        /* 修改后的绚丽背景 */
        body { 
            background: linear-gradient(45deg, #ff7e5f, #feb47b, #ffed86, #9feb8f, #5fbfff, #9b8eff); 
            background-size: 400% 400%; /* 增加背景尺寸让色彩更丝滑 */
            animation: gradientBG 15s ease infinite; /* 可选：增加一个缓慢流动的动画 */
            margin: 0; 
            overflow: hidden; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            font-family: -apple-system, sans-serif; 
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        /* 手机相机适配 */
        .camera-box { position: relative; width: 95vw; max-width: 420px; aspect-ratio: 3/4; border: 2px solid var(--gold); border-radius: 20px; overflow: hidden; background: #000; z-index: 5; box-shadow: 0 0 30px rgba(0, 0, 0, 0.3); }
        #video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }

        /* 相法面板优化（手机适配） */
        #fpp-panel { 
            position: fixed; top: 10px; left: 10px; right: 10px; 
            max-width: 260px; background: rgba(15, 23, 42, 0.92); 
            border: 1.5px solid var(--gold); border-radius: 12px; 
            padding: 12px; color: var(--gold); z-index: 1000; 
            backdrop-filter: blur(8px); display: none;
        }
        
        .grid-info { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 8px 0; }
        .data-cell { background: rgba(251, 191, 36, 0.1); padding: 5px 8px; border-radius: 4px; font-size: 12px; }
        .data-cell span { color: #fff; float: right; }

        .ancient-box { margin-top: 8px; font-size: 11px; color: #e2e8f0; line-height: 1.4; border-top: 1px dashed rgba(251,191,36,0.3); padding-top: 8px; }
        .ancient-item { margin-bottom: 4px; display: flex; }
        .label { color: var(--gold); font-weight: bold; min-width: 35px; }

        /* 引导与按钮 */
        .hud { position: fixed; inset: 0;             background: linear-gradient(45deg, #ff7e5f, #feb47b, #ffed86, #9feb8f, #5fbfff, #9b8eff); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 2000; color: var(--gold); text-align: center; }
        #startBtn { margin-top: 20px; padding: 15px 50px; background: var(--gold); color: #000; border: none; border-radius: 30px; font-weight: bold; font-size: 16px; box-shadow: 0 4px 15px rgba(251,191,36,0.4); }
        
        #shareBtn { margin-top: 10px; width: 100%; padding: 8px; background: transparent; border: 1px solid var(--gold); color: var(--gold); border-radius: 6px; font-size: 11px; display: none; }

        /* 确保猫猫不挡住面板 */
        #live2dcanvas { pointer-events: none !important; z-index: 500 !important; }
    </style>
</head>
<body>

    <div id="fpp-panel">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <span style="font-weight:bold; font-size:14px;">📜 麻衣柳庄神相</span>
            <span id="api-status" style="font-size:10px; opacity:0.7;">待命</span>
        </div>
        
        <div class="grid-info">
            <div class="data-cell">命格 <span id="f-gender">-</span></div>
            <div class="data-cell">气色 <span id="f-emotion">-</span></div>
        </div>
        <div class="data-cell">寿元 <span id="f-age">-</span></div>
        
        <div class="ancient-box">
            <div class="ancient-item"><div class="label">【眼】</div><div id="p-eye">待观...</div></div>
            <div class="ancient-item"><div class="label">【鼻】</div><div id="p-nose">待审...</div></div>
            <div class="ancient-item"><div class="label">【口】</div><div id="p-mouth">待定...</div></div>
        </div>

        <div id="f-oracle" style="font-size:11px; color:var(--gold); margin-top:8px; border-top:1px solid rgba(251,191,36,0.1); padding-top:8px; font-style:italic;">[系统] 正在捕捉面部气场...</div>
        <button id="shareBtn" onclick="handleShare()">📤 保存/分享相书</button>
    </div>

    <div class="hud" id="main-hud">
        <h2 style="letter-spacing:4px;">古籍神相追踪系统</h2>
        <p style="padding:0 40px; color:#94a3b8; font-size:12px; line-height:1.6;">猫猫随影而动，相由此心而生<br>请确保在 HTTPS 协议下允许相机权限</p>
        <button id="startBtn">开启法眼</button>
    </div>

    <div class="camera-box">
        <video id="video" playsinline muted autoplay></video>
        <canvas id="captureCanvas" style="display:none;"></canvas>
    </div>

    <script>
        const API_KEY = "Hpmt9Yim0zlRYwkhGllCMFkLama9vxNu";
        const API_SECRET = "PhCtY0gKGC6Ys6k80vTdYQ7SVcHvH_o9";
        const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
        
        let isActive = false;
        let lastResult = "";

        // 1. Live2D 初始化
        L2Dwidget.init({
            "model": { "jsonPath": "https://unpkg.com/live2d-widget-model-hijiki@1.0.5/assets/hijiki.model.json" },
            "display": { "position": "right", "width": isMobile ? 120 : 160, "height": isMobile ? 240 : 320, "hOffset": 0, "vOffset": -10 },
            "mobile": { "show": true, "scale": 0.5 },
            "react": { "opacity": 1 }
        });

        async function initSystem() {
            const btn = document.getElementById('startBtn');
            const video = document.getElementById('video');
            const hud = document.getElementById('main-hud');

            hud.style.display = 'none'; 
            btn.disabled = true;

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        facingMode: "user", 
                        width: isMobile ? { ideal: 480 } : { ideal: 1280 },
                        height: isMobile ? { ideal: 640 } : { ideal: 720 }
                    } 
                });
                video.srcObject = stream;

                const faceMesh = new FaceMesh({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}` });
                faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.6, minTrackingConfidence: 0.6 });

                faceMesh.onResults(results => {
                    try {
                        if (results.multiFaceLandmarks && results.multiFaceLandmarks[0]) {
                            if (!isActive) {
                                isActive = true;
                                document.getElementById('fpp-panel').style.display = 'block';
                                startDataLoop();
                            }

                            const nose = results.multiFaceLandmarks[0][1];
                            const targetX = (0.5 + (0.5 - nose.x) * 3.2) * window.innerWidth;
                            const targetY = (0.5 + (nose.y - 0.5) * 3.2) * window.innerHeight;
                            
                            const l2dCanvas = document.getElementById('live2dcanvas');
                            if (l2dCanvas) {
                                l2dCanvas.dispatchEvent(new MouseEvent('mousemove', { clientX: targetX, clientY: targetY, bubbles: true }));
                            }
                        }
                    } catch (e) { console.log("Tracking error suppressed."); }
                });

                await faceMesh.initialize();
                const loop = async () => {
                    if (video.readyState >= 2) await faceMesh.send({ image: video });
                    requestAnimationFrame(loop);
                };
                loop();
            } catch (err) {
                hud.style.display = 'flex';
                alert("无法启动相机，请确保：\n1. 使用 HTTPS 连接\n2. 已授予浏览器相机权限");
            }
        }

        async function startDataLoop() {
            if (!isActive) return;
            await callFacePlusPlus();
            setTimeout(startDataLoop, 10000); 
        }

        async function callFacePlusPlus() {
            const video = document.getElementById('video');
            const canvas = document.getElementById('captureCanvas');
            const statusTag = document.getElementById('api-status');
            if (video.videoWidth === 0) return;

            statusTag.innerText = "观气中...";
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.save(); ctx.translate(canvas.width, 0); ctx.scale(-1, 1);
            ctx.drawImage(video, 0, 0); ctx.restore();

            try {
                const blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', 0.8));
                const formData = new FormData();
                formData.append('api_key', API_KEY);
                formData.append('api_secret', API_SECRET);
                formData.append('image_file', blob);
                formData.append('return_attributes', 'gender,age,emotion,beauty,skinstatus,eyestatus,mouthstatus');

                const response = await fetch('https://api-cn.faceplusplus.com/facepp/v3/detect', { method: 'POST', body: formData });
                const data = await response.json();

                if (data.faces && data.faces[0]) {
                    const attrs = data.faces[0].attributes;
                    const b = (attrs.beauty.male_score + attrs.beauty.female_score) / 2;

                    const gender = attrs.gender.value === 'Male' ? '乾造 (阳)' : '坤造 (阴)';
                    const age = Math.round(attrs.age.value);
                    const emoMap = { sadness:'忧思', neutral:'恬淡', happiness:'喜乐', anger:'嗔怒', surprise:'惊奇', fear:'惊惶', disgust:'嫌恶' };
                    const topEmo = emoMap[Object.keys(attrs.emotion).reduce((a, b) => attrs.emotion[a] > attrs.emotion[b] ? a : b)] || '清静';

                    document.getElementById('f-gender').innerText = gender;
                    document.getElementById('f-age').innerText = age + " 载";
                    document.getElementById('f-emotion').innerText = topEmo;

                    let eyeTxt = b > 75 ? "目若朗星，神骨清秀，贵相也。" : "目神收敛，大智若愚，稳重之象。";
                    if(attrs.eyestatus && attrs.eyestatus.left_eye_status.no_glass_eye_close > 20) eyeTxt = "目长而秀，神韵深藏，主寿。";
                    document.getElementById('p-eye').innerText = eyeTxt;

                    let noseTxt = attrs.skinstatus.health > 70 ? "鼻若截筒，准头圆润，财星照。 " : "山根平直，财路稳固，宜守。";
                    document.getElementById('p-nose').innerText = noseTxt;

                    let mouthTxt = "口纳灵气，食禄无忧。";
                    if(attrs.mouthstatus && attrs.mouthstatus.mouth_close > 80) mouthTxt = "唇红齿白，福泽深厚。";
                    document.getElementById('p-mouth').innerText = mouthTxt;

                    let oracleTxt = b > 72 ? "柳庄神断：气血充盈，骨格清奇，乃大成之相。" : "麻衣神断：神气平和，气守丹田，稳中求进。";
                    document.getElementById('f-oracle').innerText = oracleTxt;

                    statusTag.innerText = "断毕";
                    lastResult = `【AI神相】此君${gender}，气色${topEmo}。${oracleTxt}`;
                    document.getElementById('shareBtn').style.display = 'block';
                }
            } catch (err) { statusTag.innerText = "网络阻滞"; }
        }

        async function handleShare() {
            if (navigator.share) {
                try { await navigator.share({ title: 'AI 神相报告', text: lastResult, url: window.location.href }); } catch (e) {}
            } else {
                alert("相书已存：\n" + lastResult);
            }
        }

        document.getElementById('startBtn').onclick = initSystem;
    </script>
</body>
</html>
