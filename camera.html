
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- 引入必要的 MediaPipe 库 -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/live2d-widget@3.1.4/lib/L2Dwidget.min.js"></script>
    <style>
        body { background: linear-gradient(45deg,#1e293b,#334155); margin: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; }
        .camera-box {
            position: relative; width: 85vw; max-width: 400px; aspect-ratio: 3/4;
            border: 2px solid #22d3ee; border-radius: 24px; overflow: hidden; background: #000;
            box-shadow: 0 0 20px rgba(34, 211, 238, 0.4);
        }
        #video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        .hud {
            position: fixed; top: 20px; background: rgba(15, 23, 42, 0.9);
            padding: 12px 20px; border-radius: 12px; color: #22d3ee;
            font-family: monospace; font-size: 13px; z-index: 100;
            border: 1px solid rgba(34, 211, 238, 0.3); line-height: 1.6;
        }
        .active-btn { padding: 10px 20px; background: #22d3ee; color: #000; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="hud">
        <div id="loading-wrap">
            STATUS: <span id="stat">等待加载库...</span><br>
            COORDS: <span id="coords">0, 0</span>
        </div>
        <button id="startBtn" class="active-btn">点击启动 AI 系统</button>
    </div>

    <div class="camera-box">
        <video id="video" playsinline muted autoplay></video>
    </div>

    <script>
        const video = document.getElementById('video');
        const stat = document.getElementById('stat');
        const coordsText = document.getElementById('coords');
        const startBtn = document.getElementById('startBtn');
        let isActive = false;

        // 1. 初始化看板娘 (Hijiki 猫)
        L2Dwidget.init({
            "model": { "jsonPath": "https://unpkg.com/live2d-widget-model-hijiki@1.0.5/assets/hijiki.model.json" },
            "display": { "position": "right", "width": 180, "height": 300, "hOffset": 10, "vOffset": -20 },
            "mobile": { "show": true, "scale": 0.5 },
            "react": { "opacity": 1 }
        });

        // 2. 配置 AI 面部网格
        const faceMesh = new FaceMesh({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
        });

        faceMesh.setOptions({
            maxNumFaces: 1,
            refineLandmarks: true,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        // 处理识别结果
        faceMesh.onResults(results => {
            if (results.multiFaceLandmarks && results.multiFaceLandmarks[0]) {
                const nose = results.multiFaceLandmarks[0][1];
                // 算法映射：将面部移动放大并映射到屏幕坐标
                const x = (0.5 + (0.5 - nose.x) * 2.5) * window.innerWidth;
                const y = (0.5 + (nose.y - 0.5) * 2.5) * window.innerHeight;
                
                coordsText.innerText = `${Math.round(x)}, ${Math.round(y)}`;
                stat.innerText = "追踪中 ✅";

                // 驱动看板娘：分发鼠标移动事件
                const canvas = document.querySelector('#live2dcanvas');
                const moveEvt = new MouseEvent('mousemove', {
                    clientX: x,
                    clientY: y,
                    bubbles: true
                });
                if (canvas) canvas.dispatchEvent(moveEvt);
                window.dispatchEvent(moveEvt);
            } else {
                stat.innerText = "识别中断: 未检测到面部";
            }
        });

        // 3. 循环推理函数 (修正了同步问题)
        async function runDetection() {
            if (!isActive) return;
            if (video.readyState >= 2) {
                await faceMesh.send({ image: video });
            }
            // 使用 requestAnimationFrame 保持平滑
            requestAnimationFrame(runDetection);
        }

        // 4. 系统启动
        async function startSystem() {
            try {
                startBtn.style.display = 'none';
                stat.innerText = "正在请求摄像头...";
                
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user', width: 640, height: 480 }
                });
                video.srcObject = stream;

                stat.innerText = "正在初始化 AI 模型...";
                await faceMesh.initialize(); // 关键：等待模型加载

                video.onloadedmetadata = () => {
                    video.play();
                    isActive = true;
                    stat.innerText = "系统运行中...";
                    runDetection();
                };
            } catch (err) {
                console.error(err);
                stat.innerText = "错误: 请检查 HTTPS 协议或摄像头权限";
                startBtn.style.display = 'block';
            }
        }

        startBtn.addEventListener('click', startSystem);
    </script>
</body>
</html>
