
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/live2d-widget@3.1.4/lib/L2Dwidget.min.js"></script>
    <style>
        :root { --gold: #fff; --glass: rgba(15, 23, 42, 0.98); }
        body {             background: linear-gradient(45deg, #ff7e5f, #feb47b, #ffed86, #9feb8f, #5fbfff, #9b8eff); ; margin: 0; overflow: hidden; height: 100vh; display: flex; flex-direction: column; align-items: center; font-family: "Noto Serif SC", serif; }
        .camera-box { position: relative; width: 85vw; max-width: 380px; aspect-ratio: 3/4; margin-top: 5vh; border-radius: 25px; overflow: hidden; z-index: 5; border: 2px solid var(--gold); }
        #video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        
        #fpp-panel { position: fixed; bottom: 0; left: 0; right: 0; background: var(--glass); border-top: 2px solid var(--gold); border-radius: 25px 25px 0 0; padding: 20px; color: #f8fafc; z-index: 99999; transition: transform 0.4s ease; box-shadow: 0 -10px 40px rgba(0,0,0,0.8); }
        #fpp-panel.collapsed { transform: translateY(calc(100% - 60px)); }
        .panel-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 15px; cursor: pointer; border-bottom: 1px solid rgba(251,191,36,0.3); }
        #toggle-btn { background: var(--gold); color: #000; border: none; padding: 5px 15px; border-radius: 8px; font-weight: bold; }

        .grid-info { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 15px; }
        .data-cell { background: rgba(255,255,255,0.05); padding: 10px; border-radius: 12px; text-align: center; }
        .data-cell span { color: var(--gold); font-size: 14px; font-weight: bold; }
        .score-display { grid-column: span 3; background: rgba(251,191,36,0.1); padding: 15px; }
        .ancient-scroll { max-height: 180px; overflow-y: auto; margin-top: 15px; }
        .ancient-item { background: rgba(0,0,0,0.4); padding: 12px; border-radius: 10px; margin-bottom: 10px; border-left: 3px solid var(--gold); }
        .ancient-item b { color: var(--gold); display: block; font-size: 14px; }
        .ancient-item p { margin: 0; font-size: 12px; color: #cbd5e1; }

        .hud { position: fixed; inset: 0;             background: linear-gradient(45deg, #ff7e5f, #feb47b, #ffed86, #9feb8f, #5fbfff, #9b8eff);  display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100000; color: #fff; }
        #startBtn { margin-top: 20px; padding: 15px 60px; background: var(--gold); color: #000; border: none; border-radius: 30px; font-weight: bold; font-size: 18px; }

        /* 解决点击穿透的关键 */
        #live2dcanvas { pointer-events: none !important; }
    </style>
</head>
<body>

    <div id="fpp-panel">
        <div class="panel-header" onclick="document.getElementById('fpp-panel').classList.toggle('collapsed')">
            <span style="font-weight:bold;">📜 考究·神相全书</span>
            <button id="toggle-btn">折叠</button>
        </div>
        <div class="grid-info">
            <div class="data-cell score-display"><label>精准评分</label><br><span id="f-score">0.0</span></div>
            <div class="data-cell"><label>命格</label><br><span id="f-gender">-</span></div>
            <div class="data-cell"><label>气色</label><br><span id="f-emotion">-</span></div>
            <div class="data-cell"><label>天寿</label><br><span id="f-age">-</span></div>
        </div>
        <div class="ancient-scroll">
            <div class="ancient-item"><b>【眼相】</b><p id="p-eye">等待感应...</p></div>
            <div class="ancient-item"><b>【鼻相】</b><p id="p-nose">等待感应...</p></div>
            <div class="ancient-item"><b>【骨相】</b><p id="p-bone">等待感应...</p></div>
        </div>
    </div>

    <div class="hud" id="main-hud">
        <h1 style="color:var(--gold);">古籍神相</h1>
        <button id="startBtn">开启法眼</button>
    </div>

    <div class="camera-box">
        <video id="video" playsinline muted autoplay></video>
        <canvas id="captureCanvas" style="display:none;"></canvas>
    </div>

    <script>
        const API_KEY = "Hpmt9Yim0zlRYwkhGllCMFkLama9vxNu";
        const API_SECRET = "PhCtY0gKGC6Ys6k80vTdYQ7SVcHvH_o9";
        let isActive = false;
        let lastPos = { x: 0.5, y: 0.5 };

        L2Dwidget.init({
            "model": { "jsonPath": "https://unpkg.com/live2d-widget-model-hijiki@1.0.5/assets/hijiki.model.json" },
            "display": { "position": "right", "width": 140, "height": 220, "vOffset": -20 },
            "mobile": { "show": true, "scale": 0.5 },
            "react": { "opacity": 1 }
        });

        // --- 深度坐标同步引擎 ---
        function syncCat(x, y) {
            // 1. 灵敏度增益计算 (将 0.3-0.7 范围拉伸到 0-1)
            let gainX = (x - 0.5) * 2.5 + 0.5;
            let gainY = (y - 0.5) * 2.5 + 0.5;
            
            // 边界检查
            gainX = Math.max(0, Math.min(1, gainX));
            gainY = Math.max(0, Math.min(1, gainY));

            // 2. 获取猫猫画布的实际位置
            const l2d = document.getElementById('live2dcanvas');
            if (!l2d) return;
            const rect = l2d.getBoundingClientRect();

            // 3. 计算“视觉焦点”绝对坐标
            const targetX = rect.left + (gainX * rect.width);
            const targetY = rect.top + (gainY * rect.height);

            // 4. 三路并发事件驱动 (确保引擎捕捉到信号)
            const eventProps = { clientX: targetX, clientY: targetY, bubbles: true, cancelable: true };
            const moveEvent = new MouseEvent('mousemove', eventProps);
            
            l2d.dispatchEvent(moveEvent);       // 向画布发送
            window.dispatchEvent(moveEvent);    // 向全局发送
            document.dispatchEvent(moveEvent);  // 向文档发送
        }

        async function initSystem() {
            document.getElementById('main-hud').style.display = 'none';
            document.getElementById('fpp-panel').style.display = 'block';
            const video = document.getElementById('video');

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;

                const faceMesh = new FaceMesh({
                    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
                });

                faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true });
                faceMesh.onResults(results => {
                    if (results.multiFaceLandmarks && results.multiFaceLandmarks[0]) {
                        if (!isActive) { isActive = true; startDataLoop(); }
                        const nose = results.multiFaceLandmarks[0][1];
                        // 保存最后位置用于平滑
                        lastPos = { x: 1 - nose.x, y: nose.y };
                        syncCat(lastPos.x, lastPos.y);
                    }
                });

                faceMesh.initialize().then(() => {
                    const loop = async () => {
                        if (video.readyState >= 2) await faceMesh.send({ image: video });
                        requestAnimationFrame(loop);
                    };
                    loop();
                }).catch(() => { if(!isActive) triggerCloudOnly(); });

                setTimeout(() => { if(!isActive) triggerCloudOnly(); }, 5000);
            } catch (err) { alert("权限拒绝"); }
        }

        function triggerCloudOnly() { isActive = true; startDataLoop(); }

        async function startDataLoop() {
            const video = document.getElementById('video');
            const canvas = document.getElementById('captureCanvas');
            if (video.videoWidth === 0) { setTimeout(startDataLoop, 1000); return; }

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.save(); ctx.translate(canvas.width, 0); ctx.scale(-1, 1);
            ctx.drawImage(video, 0, 0); ctx.restore();

            try {
                const blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', 0.8));
                const formData = new FormData();
                formData.append('api_key', API_KEY);
                formData.append('api_secret', API_SECRET);
                formData.append('image_file', blob);
                formData.append('return_attributes', 'gender,age,emotion,beauty,skinstatus');

                const response = await fetch('https://api-cn.faceplusplus.com/facepp/v3/detect', { method: 'POST', body: formData });
                const data = await response.json();

                if (data.faces && data.faces[0]) {
                    const attrs = data.faces[0].attributes;
                    const b = (attrs.beauty.male_score + attrs.beauty.female_score) / 2;
                    
                    document.getElementById('f-score').innerText = b.toFixed(1);
                    document.getElementById('f-gender').innerText = attrs.gender.value === 'Male' ? '乾造' : '坤造';
                    document.getElementById('f-age').innerText = Math.round(attrs.age.value);
                    document.getElementById('f-emotion').innerText = "和润";
                    document.getElementById('p-eye').innerText = b > 75 ? "凤目藏神，贵不可言。" : "目秀气清，平生顺遂。";
                    document.getElementById('p-nose').innerText = "准头圆满，财富根深。";
                    document.getElementById('p-bone').innerText = "额角峥嵘，事业有成。";

                    // 云端保底坐标
                    const r = data.faces[0].face_rectangle;
                    syncCat(1 - (r.left + r.width/2)/canvas.width, (r.top + r.height/2)/canvas.height);
                }
            } catch (err) {}
            setTimeout(startDataLoop, 10000);
        }

        document.getElementById('startBtn').onclick = initSystem;

        // 强行保持激活：每隔 100ms 微微抖动坐标，防止 Live2D 休眠
        setInterval(() => {
            if(isActive) syncCat(lastPos.x + (Math.random()*0.01-0.005), lastPos.y);
        }, 100);
    </script>
</body>
</html>
