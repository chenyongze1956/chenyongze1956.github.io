
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Face Tracker Stable</title>
    <script src="https://fastly.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/live2d-widget@3.1.4/lib/L2Dwidget.min.js"></script>
    <style>
        body { background: linear-gradient(45deg,#ff7e5f,#feb47b,#ffed86,#9feb8f,#5fbfff,#9b8eff);  margin: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: 'SF Mono', Monaco, monospace; }
        .camera-box { position: relative; width: 80vw; max-width: 360px; aspect-ratio: 3/4; border: 2px solid #22d3ee; border-radius: 20px; overflow: hidden; background: #000; box-shadow: 0 0 40px rgba(34, 211, 238, 0.1); }
        #video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        
        /* 状态框 HUD */
        .hud { 
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            background: rgba(15, 23, 42, 0.95); padding: 20px; border-radius: 16px; 
            color: #22d3ee; font-size: 11px; z-index: 100; border: 1px solid #22d3ee; 
            width: 280px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1); /* 过渡动画 */
        }
        
        #startBtn { margin-top: 15px; width: 100%; padding: 12px; background: #22d3ee; color: #0f172a; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        #startBtn:disabled { background: #334155; color: #94a3b8; cursor: not-allowed; }
        .debug-info { margin-top: 10px; background: #000; padding: 8px; border-radius: 4px; max-height: 140px; overflow-y: auto; color: #94a3b8; line-height: 1.4; border: 1px solid #1e293b; text-align: left;}
    </style>
</head>
<body>
    <div class="hud">
        <div id="status" style="font-weight: bold; font-size: 14px;">📡 SYSTEM: READY</div>
        <div class="debug-info" id="debug">等待启动...</div>
        <button id="startBtn">启动 AI 追踪系统</button>
    </div>

    <div class="camera-box">
        <video id="video" playsinline muted autoplay></video>
    </div>

    <script>
        const log = (msg) => {
            const d = document.getElementById('debug');
            d.innerHTML += `> ${msg}<br>`;
            d.scrollTop = d.scrollHeight;
        };

        let faceMesh;
        let isActive = false;

        L2Dwidget.init({ 
            "model": { "jsonPath": "https://unpkg.com/live2d-widget-model-hijiki@1.0.5/assets/hijiki.model.json" },
            "display": { "position": "right", "width": 150, "height": 280 }
        });

        async function initSystem() {
            const btn = document.getElementById('startBtn');
            const video = document.getElementById('video');
            const hud = document.querySelector('.hud');
            
            btn.disabled = true;
            btn.innerText = "正在激活引擎...";

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
                video.srcObject = stream;
                log("✅ 摄像头已就绪");

                faceMesh = new FaceMesh({
                    locateFile: (file) => {
                        let targetFile = file;
                        if (file.includes('simd')) targetFile = file.replace('_simd', '');
                        return `https://fastly.jsdelivr.net/npm/@mediapipe/face_mesh/${targetFile}`;
                    }
                });

                faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: false, minDetectionConfidence: 0.5 });

                faceMesh.onResults(results => {
                    if (results.multiFaceLandmarks?.[0]) {
                        document.getElementById('status').innerText = "🚀 STATUS: TRACKING";
                        const nose = results.multiFaceLandmarks[0][1];
                        // 映射逻辑：将面部移动映射为鼠标移动
                        const x = (0.5 + (0.5 - nose.x) * 2.5) * window.innerWidth;
                        const y = (0.5 + (nose.y - 0.5) * 2.5) * window.innerHeight;
                        
                        const canvas = document.querySelector('#live2dcanvas');
                        if (canvas) {
                            canvas.dispatchEvent(new MouseEvent('mousemove', { clientX: x, clientY: y, bubbles: true }));
                        }
                    }
                });

                log("正在拉取组件...");
                await faceMesh.initialize();

                log("✨ AI 引擎加载完毕");
                isActive = true;

                // 【自动消失逻辑】
                setTimeout(() => {
                    hud.style.opacity = "0";
                    hud.style.transform = "translate(-50%, -80%) scale(0.9)";
                    hud.style.pointerEvents = "none";
                    log("界面自动收起");
                }, 2000);
                
                const detectLoop = async () => {
                    if (isActive && video.readyState >= 2) {
                        await faceMesh.send({ image: video });
                    }
                    requestAnimationFrame(detectLoop);
                };
                detectLoop();

            } catch (e) {
                log(`❌ 错误: ${e}`);
                btn.disabled = false;
                btn.innerText = "重试启动";
            }
        }

        document.getElementById('startBtn').onclick = initSystem;
    </script>
</body>
</html>
