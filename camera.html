
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Face Tracker</title>
    <!-- 1. 确保基础库先加载 -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/live2d-widget@3.1.4/lib/L2Dwidget.min.js"></script>
    <style>
        body { background: #1a1a1a; margin: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .camera-box { position: relative; width: 85vw; max-width: 400px; aspect-ratio: 3/4; border: 2px solid #22d3ee; border-radius: 24px; overflow: hidden; background: #000; box-shadow: 0 0 30px rgba(34, 211, 238, 0.2); }
        #video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        .hud { position: fixed; top: 20px; background: rgba(0, 0, 0, 0.8); padding: 15px 20px; border-radius: 12px; color: #22d3ee; font-family: monospace; font-size: 13px; z-index: 100; border: 1px solid rgba(34, 211, 238, 0.3); min-width: 200px; }
        #startBtn { margin-top: 10px; width: 100%; padding: 10px; background: #22d3ee; color: #000; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        #startBtn:active { transform: scale(0.95); opacity: 0.8; }
        #startBtn:disabled { background: #444; color: #888; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="hud">
        STATUS: <span id="stat">准备就绪</span><br>
        COORDS: <span id="coords">0, 0</span><br>
        <button id="startBtn">启动系统</button>
    </div>

    <div class="camera-box">
        <video id="video" playsinline muted autoplay></video>
    </div>

    <script>
        const video = document.getElementById('video');
        const stat = document.getElementById('stat');
        const coordsText = document.getElementById('coords');
        const startBtn = document.getElementById('startBtn');
        let isActive = false;
        let faceMesh;

        // 1. 尽早初始化看板娘
        L2Dwidget.init({
            "model": { "jsonPath": "https://unpkg.com/live2d-widget-model-hijiki@1.0.5/assets/hijiki.model.json" },
            "display": { "position": "right", "width": 150, "height": 240 },
            "mobile": { "show": true }
        });

        // 2. 预配置 FaceMesh
        async function initAI() {
            stat.innerText = "加载核心组件...";
            faceMesh = new FaceMesh({
                locateFile: (file) => {
                    // 如果加载慢，尝试将 jsdelivr 替换为 fastly.jsdelivr.net 或 gcore.jsdelivr.net
                    return `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`;
                }
            });

            faceMesh.setOptions({
                maxNumFaces: 1,
                refineLandmarks: true,
                minDetectionConfidence: 0.5,
                minTrackingConfidence: 0.5
            });

            faceMesh.onResults(onResults);
            
            // 预热初始化
            try {
                await faceMesh.initialize();
                return true;
            } catch (e) {
                console.error("AI初始化失败:", e);
                return false;
            }
        }

        function onResults(results) {
            if (results.multiFaceLandmarks && results.multiFaceLandmarks[0]) {
                const nose = results.multiFaceLandmarks[0][1];
                const x = (0.5 + (0.5 - nose.x) * 2.5) * window.innerWidth;
                const y = (0.5 + (nose.y - 0.5) * 2.5) * window.innerHeight;
                
                coordsText.innerText = `${Math.round(x)}, ${Math.round(y)}`;
                stat.innerText = "追踪中 ✅";

                // 驱动事件
                const canvas = document.querySelector('#live2dcanvas');
                const moveEvt = new MouseEvent('mousemove', { clientX: x, clientY: y, bubbles: true });
                if (canvas) canvas.dispatchEvent(moveEvt);
            } else {
                stat.innerText = "识别中: 请对准脸部";
            }
        }

        async function detectFrame() {
            if (!isActive) return;
            if (video.readyState >= 2) {
                await faceMesh.send({ image: video });
            }
            requestAnimationFrame(detectFrame);
        }

        // 3. 启动逻辑
        startBtn.onclick = async () => {
            startBtn.disabled = true;
            startBtn.innerText = "请稍候...";
            
            try {
                // 第一步：请求摄像头
                stat.innerText = "请求摄像头权限...";
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }
                });
                video.srcObject = stream;
                
                // 第二步：初始化 AI 模型
                const isLoaded = await initAI();
                if (!isLoaded) throw new Error("模型资源加载失败");

                video.onloadedmetadata = () => {
                    video.play();
                    isActive = true;
                    stat.innerText = "系统已激活";
                    detectFrame();
                };
            } catch (err) {
                stat.innerText = "启动失败: " + err.message;
                startBtn.disabled = false;
                startBtn.innerText = "重试";
            }
        };
    </script>
</body>
</html>
