
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ZEN Dashboard Pro</title>
    <style>
        :root { 
            --accent: #00ff88; 
            --glass: rgba(0, 0, 0, 0.8); 
            --border: rgba(255, 255, 255, 0.08);
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; font-family: 'Inter', sans-serif; background: #000;
        }
        body {
            display: flex; justify-content: center; align-items: center; height: 100svh;
            background: linear-gradient(45deg, #141e30, #243b55, #0f0c29);
            background-size: 400% 400%; animation: gradientBG 15s ease infinite;
        }
        @keyframes gradientBG { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }

        .dashboard-card {
            width: 100%; max-width: 600px; height: 90vh;
            background: var(--glass); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 25px 50px rgba(0,0,0,0.4); border: 1px solid var(--border);
            transition: all 0.3s ease; position: relative;
        }

        /* 隐藏终端样式 */
        #cmd-palette {
            position: absolute; top: -100px; left: 50%; transform: translateX(-50%);
            width: 80%; max-width: 400px; background: rgba(255,255,255,0.1);
            backdrop-filter: blur(20px); border-radius: 12px; border: 1px solid var(--border);
            z-index: 9999; padding: 10px; transition: 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        #cmd-palette.active { top: 20px; }
        #cmd-input {
            width: 100%; background: transparent; border: none; color: var(--accent);
            font-family: monospace; outline: none; font-size: 14px; text-align: center;
        }

        .zen-header { padding: 15px; text-align: center; color: white; border-bottom: 1px solid var(--border); }
        #time-display { font-size: 2.2rem; font-weight: 200; letter-spacing: -1px; color: #fff; }
        #date-display { font-size: 0.65rem; letter-spacing: 3px; color: #888; text-transform: uppercase; margin-top: 4px; }

        .main-content { flex: 1; display: flex; overflow: hidden; position: relative; }
        .quote-sidebar { 
            width: 50px; padding: 10px; border-right: 1px solid var(--border); 
            display: flex; align-items: center; justify-content: center; 
            writing-mode: vertical-rl; cursor: pointer; transition: 0.2s;
        }
        .quote-sidebar:hover { background: rgba(255,255,255,0.03); }
        #quote-text { font-size: 0.8rem; color: #ccc; opacity: 0.8; letter-spacing: 3px; }

        .iframe-container { flex: 1; background: #000; position: relative; }
        #chat_embed { width: 100%; height: 100%; border: none; }

        .crypto-sidebar { width: 70px; border-left: 1px solid var(--border); background: rgba(0,0,0,0.3); overflow: hidden; }
        .ticker-v-wrap { display: flex; flex-direction: column; animation: vTicker 20s linear infinite; }
        .ticker-v-wrap:hover { animation-play-state: paused; }
        @keyframes vTicker { 0% { transform: translateY(0); } 100% { transform: translateY(-50%); } }
        .v-coin-item { padding: 20px 0; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.03); }

        .mobile-footer-ticker { display: none; height: 40px; background: rgba(0,0,0,0.6); border-top: 1px solid var(--border); overflow: hidden; align-items: center; }
        .ticker-h-wrap { white-space: nowrap; animation: hTicker 25s linear infinite; display: inline-block; }
        @keyframes hTicker { 0% { transform: translateX(10%); } 100% { transform: translateX(-100%); } }

        .symbol { display: block; font-size: 10px; color: #666; font-weight: 800; }
        .price { display: block; font-size: 11px; color: var(--accent); writing-mode: vertical-rl; margin: 5px auto 0; font-family: monospace; }
        
        @media (max-width: 768px) {
            .dashboard-card { height: 100svh; max-width: 100%; border: none; }
            .crypto-sidebar { display: none; }
            .mobile-footer-ticker { display: flex; }
            #time-display { font-size: 1.8rem; }
        }

        .h-item { display: inline-block; margin-right: 35px; color: var(--accent); font-family: monospace; font-size: 13px; }
        .h-symbol { color: #888; font-size: 10px; margin-right: 6px; font-weight: bold; }
        .douban-dot { position: fixed; bottom: 60px; left: 15px; width: 8px; height: 8px; background: #42bd56; border-radius: 50%; opacity: 0.3; z-index: 999; }
    </style>
</head>
<body>

    <div id="cmd-palette">
        <input type="text" id="cmd-input" placeholder="输入指令 (help 查看)...">
    </div>

    <div class="dashboard-card">
        <header class="zen-header">
            <div id="time-display">00:00</div>
            <div id="date-display">LOADING...</div>
        </header>

        <main class="main-content">
            <section class="quote-sidebar" onclick="initZenAudio(); updateQuote();">
                <div id="quote-text">...</div>
            </section>
            <div class="iframe-container">
                <iframe id="chat_embed" src="" referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>
            <aside class="crypto-sidebar">
                <div class="ticker-v-wrap" id="tickerV"></div>
            </aside>
        </main>

        <footer class="mobile-footer-ticker">
            <div class="ticker-h-wrap" id="tickerH"></div>
        </footer>
    </div>

    <a href="https://movie.douban.com" target="_blank" class="douban-dot"></a>

    <script>
        // 1. Twitch 逻辑
        const currentDomain = window.location.hostname || "localhost";
        function setTwitch(channel) {
            document.getElementById('chat_embed').src = `https://www.twitch.tv/embed/${channel}/chat?parent=${currentDomain}&darkpopout`;
        }
        setTwitch('velvet_7');

        // 2. 时钟逻辑
        function updateTime() {
            const now = new Date();
            document.getElementById('time-display').textContent = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');
            document.getElementById('date-display').textContent = now.toLocaleDateString('en-US', { month: 'short', day: 'numeric', weekday: 'short' });
        }
        setInterval(updateTime, 1000); updateTime();

        // 3. 语录逻辑
        const quotes = ["大道至简，悟在天成。", "心外无物，闲看花开。", "Stay hungry, Stay foolish.", "静中见真境，淡中识本然。"];
        function updateQuote() {
            const el = document.getElementById('quote-text');
            el.style.opacity = 0;
            setTimeout(() => {
                el.textContent = quotes[Math.floor(Math.random() * quotes.length)];
                el.style.opacity = 0.8;
            }, 400);
        }
        updateQuote();

        // 4. 环境音合成器逻辑 (Zen Audio)
        let audioCtx, oscillator, gainNode;
        let lastBtcPrice = 0;

        function initZenAudio() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            oscillator = audioCtx.createOscillator();
            gainNode = audioCtx.createGain();
            
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(100, audioCtx.currentTime); 
            gainNode.gain.setValueAtTime(0.02, audioCtx.currentTime); // 极低音量保持呼吸感

            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();
        }

        function updateZenAudio(newPrice) {
            if (!audioCtx) return;
            const diff = newPrice - lastBtcPrice;
            const freq = 100 + Math.min(Math.max(diff * 2, -50), 200); // 价格波动映射到频率
            oscillator.frequency.exponentialRampToValueAtTime(freq, audioCtx.currentTime + 2);
            lastBtcPrice = newPrice;
        }

        // 5. 加密货币行情
        async function getPrices() {
            try {
                const response = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,solana&vs_currencies=usd');
                const data = await response.json();
                const btcPrice = data.bitcoin.usd;
                updateZenAudio(btcPrice); // 同步更新音频频率

                const coins = [{ id: 'BTC', p: btcPrice }, { id: 'ETH', p: data.ethereum.usd }, { id: 'SOL', p: data.solana.usd }];
                renderTickers(coins);
            } catch (e) { console.error("API Error"); }
        }

        function renderTickers(coins) {
            const vHtml = coins.map(c => `<div class="v-coin-item"><span class="symbol">${c.id}</span><span class="price">$${Math.round(c.p).toLocaleString()}</span></div>`).join('');
            document.getElementById('tickerV').innerHTML = vHtml + vHtml;
            const hHtml = coins.map(c => `<span class="h-item"><span class="h-symbol">${c.id}</span>$${c.p.toLocaleString()}</span>`).join('');
            document.getElementById('tickerH').innerHTML = hHtml + hHtml;
        }
        getPrices(); setInterval(getPrices, 60000);

        // 6. 隐藏终端指令逻辑 (Command Palette)
        const cmdPalette = document.getElementById('cmd-palette');
        const cmdInput = document.getElementById('cmd-input');

        window.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                e.preventDefault();
                cmdPalette.classList.toggle('active');
                if (cmdPalette.classList.contains('active')) cmdInput.focus();
            }
            if (e.key === 'Escape') cmdPalette.classList.remove('active');
        });

        cmdInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const cmd = cmdInput.value.toLowerCase().split(' ');
                handleCommand(cmd);
                cmdInput.value = '';
                cmdPalette.classList.remove('active');
            }
        });

        function handleCommand(args) {
            const action = args[0];
            const val = args[1];

            switch(action) {
                case 'help': alert('指令列表: \ntwitch [name] \nbg [color] \naudio off/on \nclear'); break;
                case 'twitch': if(val) setTwitch(val); break;
                case 'bg': document.body.style.background = val || '#000'; break;
                case 'audio': 
                    if(val === 'off' && gainNode) gainNode.gain.setTargetAtTime(0, audioCtx.currentTime, 0.1);
                    if(val === 'on' && gainNode) gainNode.gain.setTargetAtTime(0.02, audioCtx.currentTime, 0.1);
                    break;
                case 'clear': location.reload(); break;
            }
        }
    </script>
</body>
</html>
